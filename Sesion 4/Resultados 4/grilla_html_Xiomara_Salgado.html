<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilla de archivos HTML - Exportada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eff0f1;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { font-size: 22px; color: #0072df; }
        .header p { font-size: 13px; color: #888; margin-top: 4px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #f0f0f0;
        }
        .card-title {
            padding: 10px 12px;
            font-size: 12px;
            color: #333;
            line-height: 1.3;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-title:hover { color: #0072df; }
        @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 550px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>

    <script>
        var CONTENTS = {"Paper_análisis.html":"\n            <!DOCTYPE html>\n            <html lang=\"es\">\n            <head>\n                <meta charset=\"UTF-8\">\n                <title>Analiza artículo PDF - Sesión</title>\n                <style>\n                    body { font-family: sans-serif; line-height: 1.6; padding: 20px; color: #333; }\n                    .user-message { background-color: #007bff; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; margin-left: auto; text-align: right; }\n                    .bot-message { background-color: #e9ecef; color: #343a40; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; }\n                    .system-message { text-align: center; color: #666; font-style: italic; margin-bottom: 10px; }\n                    pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }\n                    code { background: #eee; padding: 2px 4px; border-radius: 3px; }\n                    .bot-message code { background: #d0d0d0; }\n                </style>\n            </head>\n            <body>\n                <h2>Sesión de Chat - Analiza artículo PDF</h2>\n                <p>Archivo cargado: Bases de datos.pdf</p>\n                <hr>\n                <div class=\"chat-container\">\n                    <div class=\"system-message\">Por favor, carga un PDF para comenzar.</div><div class=\"system-message\">Cargando Bases de datos.pdf...</div><div class=\"system-message\">\"Bases de datos.pdf\" está listo.</div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">de qué trataa el documento</div>\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/perfil%20de%20un%20investigador?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"User Avatar\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/AI%20bot%20asistente?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"Bot Avatar\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>El documento <strong>“Recomendaciones”</strong> trata sobre <strong>cómo desarrollar y aplicar la “alfabetización informacional”</strong> en el contexto académico, con un enfoque práctico para <strong>formación de usuarios de una base de datos (Biblioteca CRAI+I)</strong>.</p>\n<p>En concreto, organiza la información en torno a:</p>\n<ul>\n<li><strong>Concepto de alfabetización informacional:</strong> Gómez &amp; Benito (2001) la definen como un <strong>proceso de aprendizaje</strong> que incluye identificar una necesidad o problema, buscar recursos, reunir y analizar información, sintetizar, comunicar y evaluar el trabajo (p. 56).</li>\n<li><strong>Etapas de una búsqueda efectiva:</strong> Reconocer la necesidad de información; definir el nivel de profundidad y el propósito; <strong>identificar fuentes pertinentes</strong>; diseñar la estrategia; refinar la búsqueda; evaluar resultados; y <strong>organizar, administrar y usar</strong> la información.</li>\n<li><strong>Importancia de definir el tema:</strong> Indica responder a “¿por qué?”, “¿para qué?”, “¿cuándo (rango de fechas)?” “¿dónde (área geográfica)?” y “qué aspecto considerar (social, político, económico, histórico, etc.)”, además de <strong>delimitar el tema</strong>.</li>\n<li><strong>Uso de palabras clave y términos de búsqueda:</strong> Recomienda emplear <strong>sustantivos</strong> como descriptores (y preferir términos en inglés en muchas fuentes).</li>\n<li><strong>Estrategia de búsqueda y operadores lógicos:</strong> Presenta conceptos como <strong>OR (unión), AND (intersección)</strong> y <strong>NOT (exclusión)</strong>, explicando cómo afectan el resultado de la búsqueda.</li>\n<li><strong>Calidad de la información:</strong> Plantea la evaluación de la información por criterios como <strong>confiable, actualizada, relevante, verificable y académica</strong>, así como riesgos de no evaluar (p. ej., datos falsos, desinformación, plagio).</li>\n<li><strong>Organización y gestión de resultados:</strong> Recomienda administrar referencias en bases de datos, crear carpetas, guardar PDFs, compartir recursos y generar bibliografías (p. ej., <strong>APA, Vancouver, IEEE</strong>), además de insertar citas y referencias automáticamente.</li>\n<li><strong>Herramienta institucional citada:</strong> <strong>APP.MYLOFT.XYZ</strong>, descrita como una aplicación móvil y de escritorio para acceder, organizar y guardar recursos electrónicos suscritos por la biblioteca.</li>\n</ul>\n<p>Como referencia final, incluye a <strong>Moncada Hernández (2014)</strong> sobre cómo realizar una búsqueda de información eficiente.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: openai\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Para cada punto principal, explícame por qué es importante en la práctica. Si no lo es, dilo.</div>\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/perfil%20de%20un%20investigador?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"User Avatar\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/AI%20bot%20asistente?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"Bot Avatar\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Claro. El documento <strong>“Recomendaciones”</strong> organiza sus contenidos en varios puntos principales. A continuación explico <strong>por qué es importante en la práctica</strong> cada uno, y marco cuando <strong>no lo considera realmente como un punto importante</strong> (en el sentido de que no se plantea como “imprescindible” sino como una sugerencia menor).</p>\n<h2>1) Alfabetización informacional (definición y proceso)</h2>\n<p><strong>Por qué es importante:</strong> La alfabetización informacional funciona como una <strong>competencia integral</strong> para hacer investigación: no solo “buscar”, sino <strong>evaluar, analizar, sintetizar, comunicar y valorar</strong> el resultado. Si el proceso es incompleto, el trabajo queda en riesgo de basarse en información mala, irrelevante o mal citada.<br><strong>Base en el documento:</strong> Gómez &amp; Benito (2001) describen el proceso como un aprendizaje que abarca todo el ciclo (p. 56).  </p>\n<h2>2) Etapas de una búsqueda efectiva (visión de conjunto)</h2>\n<p><strong>Por qué es importante:</strong> Presentar la búsqueda como un <strong>proceso por etapas</strong> evita fallos comunes (por ejemplo, buscar sin delimitar, o evaluar tarde). En práctica, reduce el tiempo perdido y mejora la calidad de la revisión bibliográfica.<br><strong>Cómo lo plantea:</strong> incluye (1) reconocer necesidad, (2) definir profundidad y propósito, (3) identificar fuentes pertinentes, (4) construir la estrategia, (5) evaluar resultados y (6) organizar/administrar/usar información.</p>\n<h2>3) Reconocer la necesidad de información</h2>\n<p><strong>Por qué es importante:</strong> Determina <strong>qué problema real</strong> se quiere resolver (no solo “buscar por buscar”). Cuando la necesidad está mal definida, se eligen fuentes y criterios de relevancia incorrectos.<br><strong>Se considera importante:</strong> Sí; aparece como la primera etapa.</p>\n<h2>4) Definir profundidad, propósito y límites (¿qué quiero?, ¿cuánto sé?, ¿cuánto tiempo tengo?)</h2>\n<p><strong>Por qué es importante:</strong> Ajusta el nivel de búsqueda a tu objetivo (por ejemplo, revisión amplia vs. información puntual) y al <strong>tiempo disponible</strong>. En la práctica, ayuda a elegir mejor el tipo de fuentes (manuales, artículos, bases especializadas) y a evitar sobrecarga.</p>\n<p><strong>Se considera importante:</strong> Sí; el documento lo enmarca como parte de definir el marco de búsqueda.</p>\n<h2>5) “¿Por qué? / ¿Para qué? / ¿Cuándo? / ¿Dónde? / ¿Qué aspecto?” (delimitación del tema)</h2>\n<p><strong>Por qué es importante:</strong> Esta delimitación convierte una intención vaga (“quiero saber de X”) en un marco investigable y reduce resultados irrelevantes. También permite justificar criterios de inclusión/exclusión (rango temporal, contexto geográfico y dimensión temática).<br><strong>Se considera importante:</strong> Sí; el documento lo presenta como componente de la importancia de desarrollar el tema.</p>\n<h2>6) Delimitar el tema</h2>\n<p><strong>Por qué es importante:</strong> Es la consecuencia práctica de lo anterior: reduce el “ruido” en la búsqueda y facilita evaluar si un recurso realmente aporta. Si no se delimita, es fácil caer en recopilaciones superficiales o incoherentes.<br><strong>Se considera importante:</strong> Sí (está indicado explícitamente como paso vinculado a la delimitación).</p>\n<h2>7) Palabras clave (descriptores) y cómo formularlas</h2>\n<p><strong>Por qué es importante:</strong> Las palabras clave controlan directamente la recuperación en catálogos y bases de datos. El documento recomienda:</p>\n<ul>\n<li><strong>Preferir sustantivos</strong> (mejor precisión conceptual).</li>\n<li><strong>Evitar adjetivos/adverbios</strong> y palabras poco significativas.</li>\n<li>Evitar infinitivos/participios y usar <strong>frases nominales</strong> (más consistentes con términos indexados).</li>\n<li>Evitar siglas salvo que sean aprobadas o conocidas.</li>\n</ul>\n<p>En práctica, esto mejora la <strong>precisión</strong> de resultados y reduce irrelevancia.</p>\n<p><strong>Se considera importante:</strong> Sí; se dedica un bloque sustancial a recomendaciones concretas.</p>\n<h2>8) Identificar fuentes de información pertinentes (áreas/tipos de fuentes)</h2>\n<p><strong>Por qué es importante:</strong> No todas las fuentes responden igual a una necesidad. El documento enumera opciones como material impreso, colecciones electrónicas, bases de datos especializadas, revistas, periódicos, expertos, catálogos y sitios web. Elegir bien evita:</p>\n<ul>\n<li>usar fuentes no académicas cuando se busca evidencia científica,</li>\n<li>perder tiempo en tipos de fuente que no aportan el nivel de detalle requerido.</li>\n</ul>\n<p><strong>Se considera importante:</strong> Sí; se posiciona como una fase clara (“IDENTIFICAR FUENTES…”).</p>\n<h2>9) Construcción de la estrategia de búsqueda (refinar la búsqueda)</h2>\n<p><strong>Por qué es importante:</strong> Una estrategia bien diseñada permite pasar de resultados amplios a resultados útiles, y facilita reproducibilidad (poder repetir la búsqueda con criterios claros).<br><strong>Se considera importante:</strong> Sí; aparece como un componente “de diseño” y refinamiento.</p>\n<h2>10) Operadores lógicos booleanos (AND/OR/NOT) y mapa de búsqueda</h2>\n<p><strong>Por qué es importante:</strong> En la práctica, los operadores booleanos son herramientas para:</p>\n<ul>\n<li><strong>AND</strong>: restringir a intersección (menos ruido).</li>\n<li><strong>OR</strong>: ampliar con sinónimos/variantes (no perder evidencia).</li>\n<li><strong>NOT</strong>: excluir un concepto que contamina (mejor relevancia).</li>\n</ul>\n<p>Esto suele ser decisivo cuando hay demasiados resultados o cuando te falta cobertura.</p>\n<p><strong>Se considera importante:</strong> Sí; se explica con intención funcional directa.</p>\n<h2>11) Evaluar la información (calidad: confiable, actualizada, relevante, verificable, académica)</h2>\n<p><strong>Por qué es importante:</strong> Es crucial para evitar conclusiones erróneas. El documento además explicita riesgos: datos falsos, plagio, desinformación, baja calidad académica y confusión en la investigación.<br><strong>Se considera importante:</strong> Sí; además ofrece características y consecuencias.</p>\n<h2>12) Riesgos de no evaluar la información</h2>\n<p><strong>Por qué es importante:</strong> Hace explícito el costo de omitir la evaluación: no es solo “hacerlo mejor”, sino evitar daños académicos (plagio/desinformación), fallos metodológicos y decisiones equivocadas.<br><strong>Se considera importante:</strong> Sí; se incluye como advertencia.</p>\n<h2>13) Organización, administración y uso de la información (carpetas, PDFs, bibliografías, normas)</h2>\n<p><strong>Por qué es importante:</strong> La calidad de la investigación no termina en encontrar fuentes: hay que <strong>gestionar resultados</strong> para poder citarlos bien y evitar perder trazabilidad. El documento menciona:</p>\n<ul>\n<li>administrar información bibliográfica,</li>\n<li>crear carpetas,</li>\n<li>editar referencias,</li>\n<li>guardar PDFs,</li>\n<li>crear bibliografías (APA/Vancouver/IEEE),</li>\n<li>insertar citas y referencias automáticamente.</li>\n</ul>\n<p>En práctica, esto reduce errores de citación, mejora el orden del trabajo y acelera la redacción final.</p>\n<p><strong>Se considera importante:</strong> Sí; es un bloque central y con acciones concretas.</p>\n<h2>14) Herramienta institucional (APP.MYLOFT.XYZ)</h2>\n<p><strong>Por qué es importante:</strong> Si realmente se usa, facilita acceso y gestión de recursos suscritos por la biblioteca. En práctica, puede mejorar eficiencia (centraliza acceso/guardado/organización).<br><strong>Se considera importante:</strong> Sí, aunque más como <strong>apoyo operativo</strong> que como marco conceptual; el documento la presenta como facilitador.</p>\n<h2>15) Referencia metodológica final (Moncada Hernández, 2014)</h2>\n<p><strong>Por qué es importante:</strong> El documento incluye una bibliografía para profundizar en búsqueda eficiente “foco en estudiantes, profesores e investigadores” del área educativa. Eso aporta respaldo metodológico complementario.<br><strong>Se considera importante:</strong> Sí como recomendación para ampliar.</p>\n<hr>\n<p>Si quieres, puedo convertir estos puntos en una <strong>lista de verificación práctica</strong> (checklist) para que puedas aplicarlos paso a paso en una búsqueda real.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: openai\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Si quiero la lista de verificación</div>\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/perfil%20de%20un%20investigador?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"User Avatar\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/AI%20bot%20asistente?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"Bot Avatar\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Aquí tienes una <strong>lista de verificación</strong> basada en los contenidos del documento <strong>“Recomendaciones”</strong>, organizada por momentos del proceso.</p>\n<h2>Lista de verificación (checklist)</h2>\n<h3>A. Antes de buscar: definir la necesidad y el marco</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Reconozco la necesidad de información</strong>: ¿qué no entiendo, qué tarea nueva enfrento o qué problema debo resolver?</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Defino el nivel de profundidad</strong> requerida (precisión del tema).</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Respondo para qué necesito la información</strong> (“¿PARA QUÉ?”) y <strong>qué objetivo persigo</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Respondo para qué/por qué</strong> (“¿POR QUÉ?”) y <strong>en qué contexto</strong> la usaré.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Defino el cuándo</strong>: establezco <strong>rango de fechas</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Defino el dónde</strong>: establezco <strong>área geográfica</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Delimito el tema considerando el aspecto</strong>: social, político, económico, histórico, etc.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Delimito el tema</strong> para reducir ruido y mantener coherencia (no busco “todo”, busco “lo pertinente”).</li>\n</ul>\n<h3>B. Formular la búsqueda: términos y palabras clave</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Identifico términos clave</strong> a partir del tema delimitado.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Uso <strong>palabras clave como descriptores</strong> (no “palabras” sueltas), procurando que representen el contenido de los textos.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Preferentemente uso sustantivos</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Evito <strong>adjetivos y adverbios</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Evito palabras poco significativas (por ejemplo: “análisis”, “descripción”, “investigación”).</li>\n<li><input disabled=\"\" type=\"checkbox\"> Evito <strong>infinitivos y participios</strong>; si puedo, empleo <strong>frases verbales con sustantivos</strong> (p. ej., “Administración” en lugar de “Administrar”).</li>\n<li><input disabled=\"\" type=\"checkbox\"> Evito <strong>siglas o acrónimos</strong> salvo que sean conocidos/aceptados.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Considero que <strong>muchas palabras clave relevantes aparecen publicadas en inglés</strong> (planifico la búsqueda en inglés si es necesario).</li>\n</ul>\n<h3>C. Seleccionar fuentes (dónde buscar)</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Elijo <strong>tipos de fuentes pertinentes</strong> según mi necesidad:<ul>\n<li><input disabled=\"\" type=\"checkbox\"> material impreso</li>\n<li><input disabled=\"\" type=\"checkbox\"> colecciones electrónicas</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>bases de datos especializadas</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> revistas</li>\n<li><input disabled=\"\" type=\"checkbox\"> periódicos</li>\n<li><input disabled=\"\" type=\"checkbox\"> expertos</li>\n<li><input disabled=\"\" type=\"checkbox\"> catálogos</li>\n<li><input disabled=\"\" type=\"checkbox\"> sitios web</li>\n</ul>\n</li>\n<li><input disabled=\"\" type=\"checkbox\"> Verifico que la fuente seleccionada sea coherente con el carácter <strong>académico/verificable</strong> que necesito.</li>\n</ul>\n<h3>D. Construir y refinar la estrategia</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Diseñé la estrategia de búsqueda (“defino el cómo”): cómo voy a buscar y con qué criterios.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Realizo <strong>refinamiento de la búsqueda</strong> cuando los resultados no son adecuados.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Uso un <strong>mapa de búsqueda</strong> con conceptos y relaciones.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Aplico operadores lógicos para controlar resultados:<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>AND</strong> para intersección (resultados que contengan todas las palabras).</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>OR</strong> para unión/expansión (resultados con una u otra expresión).</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>NOT</strong> para exclusión (evitar un concepto que contamine resultados).</li>\n</ul>\n</li>\n</ul>\n<h3>E. Evaluar resultados: calidad de la información</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Evalúo si la información es:<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>confiable</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>actualizada</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>relevante</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>verificable</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>académica</strong></li>\n</ul>\n</li>\n<li><input disabled=\"\" type=\"checkbox\"> Corroboro características de calidad (según el documento): precisión, claridad, verificación, organización, y <strong>basada en evidencia científica</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Considero riesgos de no evaluar:<ul>\n<li><input disabled=\"\" type=\"checkbox\"> posible uso de <strong>datos falsos o incorrectos</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> riesgo de <strong>plagio o desinformación</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> probabilidad de incorporar <strong>trabajos académicos de baja calidad</strong></li>\n<li><input disabled=\"\" type=\"checkbox\"> aumento de <strong>confusión</strong> en la investigación</li>\n</ul>\n</li>\n</ul>\n<h3>F. Gestionar y usar la información (de forma reproducible)</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Organizo</strong>: creo y mantengo <strong>carpetas</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Administro referencias</strong> en la base de datos (artículos, capítulos, tesis, libros, etc.).</li>\n<li><input disabled=\"\" type=\"checkbox\"> <strong>Guardo documentos</strong> en formato <strong>PDF</strong>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Edito o construyo referencias cuando sea necesario (de forma consistente).</li>\n<li><input disabled=\"\" type=\"checkbox\"> Genero bibliografías y referencias en el estilo requerido (<strong>APA, Vancouver, IEEE</strong>).</li>\n<li><input disabled=\"\" type=\"checkbox\"> Inserto <strong>citas y referencias automáticamente</strong> en el documento de trabajo (si dispongo de la herramienta).</li>\n<li><input disabled=\"\" type=\"checkbox\"> Comparto carpetas y anotaciones solo si el contexto lo permite.</li>\n</ul>\n<h3>G. Soporte operativo (si lo usas)</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Si procede, utilizo <strong>APP.MYLOFT.XYZ</strong> para acceder, organizar y guardar recursos electrónicos suscritos por la biblioteca.</li>\n</ul>\n<h3>H. Referencia para mejorar método (opcional)</h3>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Consulto <strong>Moncada Hernández (2014)</strong> como apoyo metodológico para una búsqueda de información eficiente.</li>\n</ul>\n<hr>\n<p>Si me dices tu <strong>tema</strong> y tu <strong>ámbito</strong> (p. ej., educativo, social, político, histórico) puedo ayudarte a convertir esta checklist en una <strong>estrategia de búsqueda concreta</strong> (términos + AND/OR/NOT + posibles fuentes).</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: openai\n                        </div>\n                    </div>\n                </div>\n            </div>\n                </div>\n            </body>\n            </html>\n        ","Paper.html":"\n            <!DOCTYPE html>\n            <html lang=\"es\">\n            <head>\n                <meta charset=\"UTF-8\">\n                <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n                <title>Derecho de autor en Colombia: fundamentos normativos, alcance y desafíos contemporáneos</title>\n                <style>\n        :root {\n            --bg-color: #1a1a2e;\n            --primary-color: #16213e;\n            --secondary-color: #0f3460;\n            --accent-color: #5372f0;\n            --text-color: #e4e4e4;\n            --header-text-color: #ffffff;\n            --border-color: #4a4a6a;\n            --input-bg-color: #2c2c44;\n            --button-hover-bg: #6f8cff;\n            --report-bg: #1e1e36;\n            --error-color: #ff6b6b;\n            --success-color: #7bed9f;\n            --success-color-dark: #2ed573;\n            /* --- COLOR DE ENLACE MEJORADO --- */\n            --source-link-color: #8bbaff;\n            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n        }\n\n        body {\n            font-family: var(--font-family);\n            background-color: var(--bg-color);\n            color: var(--text-color);\n            margin: 0;\n            padding: 0;\n            line-height: 1.6;\n            display: flex;\n            flex-direction: column;\n            min-height: 100vh;\n        }\n\n        header {\n            background-color: var(--primary-color);\n            color: var(--header-text-color);\n            padding: 1rem 2rem;\n            text-align: center;\n            border-bottom: 3px solid var(--accent-color);\n            display: flex;\n            align-items: center;\n            justify-content: center;\n        }\n\n        header h1 {\n            margin: 0;\n            font-size: 2rem;\n            font-weight: 600;\n        }\n\n        main {\n            flex-grow: 1;\n            padding: 2rem;\n            max-width: 900px;\n            margin: 0 auto;\n            width: 100%;\n            box-sizing: border-box;\n        }\n\n        .tagline {\n            text-align: center;\n            font-size: 1.1rem;\n            color: var(--accent-color);\n            margin-bottom: 2rem;\n        }\n\n        .input-section {\n            display: flex;\n            gap: 1rem;\n            margin-bottom: 2rem;\n            align-items: center;\n            flex-wrap: wrap;\n            /* Permitir ajuste en móviles */\n        }\n\n        #topicInput {\n            flex-grow: 1;\n            padding: 0.75rem 1rem;\n            font-size: 1rem;\n            background-color: var(--input-bg-color);\n            color: var(--text-color);\n            border: 1px solid var(--border-color);\n            border-radius: 5px;\n            outline: none;\n            min-width: 200px;\n        }\n\n        #topicInput:focus {\n            border-color: var(--accent-color);\n            box-shadow: 0 0 5px var(--accent-color);\n        }\n\n        /* --- ESTILOS DEL SELECTOR DE MODELO --- */\n        #modelSelect {\n            padding: 0.75rem 1rem;\n            font-size: 1rem;\n            background-color: var(--input-bg-color);\n            color: var(--text-color);\n            border: 1px solid var(--border-color);\n            border-radius: 5px;\n            outline: none;\n            cursor: pointer;\n            min-width: 150px;\n        }\n\n        #modelSelect:focus {\n            border-color: var(--accent-color);\n            box-shadow: 0 0 5px var(--accent-color);\n        }\n\n        /* --- ESTILOS DEL INPUT DE PALABRAS --- */\n        #wordCountInput {\n            padding: 0.75rem 1rem;\n            font-size: 1rem;\n            background-color: var(--input-bg-color);\n            color: var(--text-color);\n            border: 1px solid var(--border-color);\n            border-radius: 5px;\n            outline: none;\n            width: 90px;\n        }\n\n        #wordCountInput:focus {\n            border-color: var(--accent-color);\n            box-shadow: 0 0 5px var(--accent-color);\n        }\n\n        /* -------------------------------------- */\n        #researchButton {\n            padding: 0.75rem 1.5rem;\n            font-size: 1rem;\n            background-color: var(--accent-color);\n            color: var(--header-text-color);\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            transition: background-color 0.3s ease;\n            font-weight: 500;\n            white-space: nowrap;\n        }\n\n        #researchButton:hover:not(:disabled) {\n            background-color: var(--button-hover-bg);\n        }\n\n        #researchButton:disabled {\n            background-color: var(--secondary-color);\n            cursor: not-allowed;\n            opacity: 0.7;\n        }\n\n        .status-container {\n            margin-bottom: 2rem;\n            padding: 1rem;\n            background-color: var(--secondary-color);\n            border-radius: 5px;\n            border-left: 5px solid var(--accent-color);\n            min-height: 20px;\n        }\n\n        .status-update {\n            color: var(--text-color);\n            margin: 0.5rem 0;\n            font-style: italic;\n        }\n\n        .status-update span.dot-container {\n            display: inline-block;\n            width: 30px;\n        }\n\n        .status-update span.dot {\n            display: inline-block;\n            animation: blink 1.4s infinite both;\n            opacity: 0;\n            margin: 0 1px;\n        }\n\n        .status-update span.dot:nth-child(1) {\n            animation-delay: 0s;\n        }\n\n        .status-update span.dot:nth-child(2) {\n            animation-delay: .2s;\n        }\n\n        .status-update span.dot:nth-child(3) {\n            animation-delay: .4s;\n        }\n\n        @keyframes blink {\n\n            0%,\n            100% {\n                opacity: 0;\n            }\n\n            50% {\n                opacity: 1;\n            }\n        }\n\n        .status-final {\n            color: var(--success-color);\n            font-weight: bold;\n            margin: 0.5rem 0;\n        }\n\n        .report-container {\n            background-color: var(--report-bg);\n            padding: 1.5rem;\n            border-radius: 5px;\n            border: 1px solid var(--border-color);\n            min-height: 100px;\n            max-height: 60vh;\n            overflow-y: auto;\n            color: var(--text-color);\n        }\n\n        .report-container h2 {\n            color: var(--accent-color);\n            border-bottom: 2px solid var(--secondary-color);\n            padding-bottom: 0.5rem;\n            margin-top: 0;\n        }\n\n        .report-container h3 {\n            color: var(--text-color);\n            margin-top: 1.5rem;\n            margin-bottom: 0.75rem;\n            border-bottom: 1px dashed var(--border-color);\n            padding-bottom: 0.3rem;\n        }\n\n        .report-container p {\n            margin-bottom: 1rem;\n            line-height: 1.7;\n        }\n\n        .report-container ul,\n        .report-container ol {\n            margin-bottom: 1rem;\n            padding-left: 2rem;\n        }\n\n        .report-container li {\n            margin-bottom: 0.5rem;\n        }\n\n        .report-container strong {\n            color: var(--accent-color);\n        }\n\n        .report-container ul li a {\n            color: var(--source-link-color);\n            text-decoration: none;\n            transition: color 0.2s ease-in-out;\n        }\n\n        .report-container ul li a:hover {\n            color: var(--button-hover-bg);\n            text-decoration: underline;\n        }\n\n        .report-container .error,\n        .status-container .error {\n            color: var(--error-color);\n            font-weight: bold;\n            padding: 0.5rem;\n            border-left: 3px solid var(--error-color);\n            background-color: rgba(255, 107, 107, 0.1);\n        }\n\n        .action-buttons {\n            display: flex;\n            justify-content: center;\n            gap: 1rem;\n            margin-top: 1.5rem;\n        }\n\n        .download-button {\n            padding: 0.75rem 1.5rem;\n            font-size: 1rem;\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            transition: background-color 0.3s ease;\n            font-weight: 500;\n            background-color: var(--success-color-dark);\n            color: var(--header-text-color);\n        }\n\n        .download-button:hover {\n            background-color: var(--success-color);\n            color: var(--primary-color);\n        }\n\n        footer {\n            background-color: var(--primary-color);\n            color: var(--text-color);\n            text-align: center;\n            padding: 1rem;\n            font-size: 0.9rem;\n            margin-top: auto;\n            border-top: 1px solid var(--border-color);\n        }\n\n        ::-webkit-scrollbar {\n            width: 10px;\n        }\n\n        ::-webkit-scrollbar-track {\n            background: var(--secondary-color);\n            border-radius: 5px;\n        }\n\n        ::-webkit-scrollbar-thumb {\n            background: var(--accent-color);\n            border-radius: 5px;\n        }\n\n        ::-webkit-scrollbar-thumb:hover {\n            background: var(--button-hover-bg);\n        }\n\n        /* --- ESTILOS PARA IMPRESIÓN / GUARDADO EN PDF --- */\n        @media print {\n            body>*:not(main) {\n                display: none;\n            }\n\n            main>*:not(#reportDisplay) {\n                display: none;\n            }\n\n            body,\n            main {\n                background-color: #ffffff !important;\n                color: #000000 !important;\n                padding: 0;\n                margin: 0;\n            }\n\n            #reportDisplay {\n                max-height: none !important;\n                overflow-y: visible !important;\n                border: none !important;\n                box-shadow: none !important;\n                padding: 1cm !important;\n                color: #000000 !important;\n                background-color: #ffffff !important;\n            }\n\n            #reportDisplay h2,\n            #reportDisplay h3,\n            #reportDisplay strong {\n                color: #000000 !important;\n            }\n\n            #reportDisplay h2 {\n                border-bottom: 2px solid #ccc !important;\n            }\n\n            #reportDisplay h3 {\n                border-bottom: 1px dashed #ddd !important;\n            }\n\n            #reportDisplay a {\n                color: #0000ee !important;\n                text-decoration: underline !important;\n            }\n\n            #reportDisplay a[href]:after {\n                content: \" (\" attr(href) \")\";\n                font-size: 0.8em;\n                color: #555;\n            }\n        }\n    </style>\n            </head>\n            <body>\n                <main style=\"max-width: 900px; margin: 2rem auto;\">\n                    <div class=\"report-container\" style=\"max-height: none; overflow-y: visible;\">\n                        <h2>Derecho de autor en Colombia: fundamentos normativos, alcance y desafíos contemporáneos</h2>\n\n<h3>Resumen</h3>\n<p>El derecho de autor en Colombia es un régimen jurídico de protección de las creaciones literarias, artísticas y científicas que nace con la obra misma y no depende, en principio, de formalidades previas. Su desarrollo normativo articula fuentes constitucionales, legales y andinas, especialmente el artículo 61 de la Constitución Política, la Ley 23 de 1982 y la Decisión Andina 351 de 1993, además de la función institucional de la Dirección Nacional de Derecho de Autor (DNDA) como autoridad administrativa especializada (Dirección Nacional de Derecho de Autor, s. f.; Gobierno de Colombia, 1982). Este artículo examina sus fundamentos teóricos, la metodología de análisis documental utilizada, los principales resultados sobre titularidad, duración, registro y derechos morales y patrimoniales, y discute los retos que plantea el entorno digital. Se concluye que el sistema colombiano ofrece una protección robusta en términos normativos, pero enfrenta tensiones prácticas relacionadas con la informalidad, la circulación digital no autorizada y la necesidad de mayor cultura jurídica entre autores y usuarios (Dirección Nacional de Derecho de Autor, s. f.; Universidad UTB, s. f.).</p>\n\n<h3>Abstract</h3>\n<p>Copyright law in Colombia is a legal regime that protects literary, artistic, and scientific creations. It arises automatically upon creation and does not, in principle, depend on prior formalities. Its normative framework combines constitutional, statutory, and Andean sources, especially Article 61 of the Political Constitution, Law 23 of 1982, and Andean Decision 351 of 1993, along with the institutional role of the National Copyright Directorate (DNDA) as the specialized administrative authority (Dirección Nacional de Derecho de Autor, n.d.; Gobierno de Colombia, 1982). This article examines its theoretical foundations, the documentary analysis methodology employed, the main findings regarding ownership, term, registration, and moral and economic rights, and discusses the challenges posed by the digital environment. The article concludes that the Colombian system provides strong normative protection, but practical tensions persist due to informality, unauthorized digital circulation, and the need for broader legal literacy among authors and users (Dirección Nacional de Derecho de Autor, n.d.; Universidad UTB, n.d.).</p>\n\n<h3>Palabras clave</h3>\n<p>derecho de autor; propiedad intelectual; Colombia; derechos morales; derechos patrimoniales; DNDA; registro de obras.</p>\n\n<h3>Introducción</h3>\n<p>El derecho de autor constituye uno de los pilares de la propiedad intelectual porque protege la relación entre el creador y su obra, al tiempo que organiza las condiciones de explotación social y económica de las expresiones originales. En Colombia, esta protección no solo se deriva del reconocimiento constitucional de la propiedad intelectual, sino también de una tradición normativa que ha buscado equilibrar los intereses del autor, los herederos, los usuarios y el interés público en el acceso a la cultura y al conocimiento (Gobierno de Colombia, 1991; Gobierno de Colombia, 1982).</p>\n<p>La relevancia del tema ha aumentado por la expansión de los entornos digitales, donde la reproducción, distribución y comunicación pública de obras puede realizarse a una escala inédita. En ese contexto, la pregunta no es únicamente qué protege el derecho de autor, sino cómo opera en la práctica y qué mecanismos institucionales hacen posible su tutela efectiva. La Dirección Nacional de Derecho de Autor señala que la protección recae sobre obras literarias, artísticas y científicas, y que el registro es gratuito y se realiza a través de su plataforma oficial, aunque la protección surge desde la creación misma de la obra (Dirección Nacional de Derecho de Autor, s. f.; Registro en Línea, s. f.).</p>\n<p>Este artículo analiza el derecho de autor en Colombia desde una perspectiva jurídico-descriptiva y crítica. El objetivo es identificar sus fundamentos, explicar su estructura normativa y valorar los principales desafíos contemporáneos. La discusión se organiza alrededor de cinco ejes: fuente normativa, objeto de protección, titularidad, duración y registro, con énfasis en el contraste entre la protección formal y su efectividad social.</p>\n\n<h3>Marco teórico</h3>\n<p>El derecho de autor se entiende como el conjunto de prerrogativas que el ordenamiento reconoce al creador sobre su obra. En la doctrina institucional colombiana, se define como la disciplina normativa que protege obras literarias, artísticas o científicas y reconoce al autor como persona natural que realiza la creación intelectual (Registro en Línea, s. f.; Dirección Nacional de Derecho de Autor, s. f.). Esta concepción coincide con la idea de que la obra es una manifestación original del intelecto susceptible de ser divulgada o reproducida.</p>\n<p>La estructura del derecho de autor en Colombia se organiza, de manera clásica, en dos grandes dimensiones. Por un lado, los <strong>derechos morales</strong>, vinculados con la personalidad del autor y con facultades como paternidad, integridad, ineditud y modificación. Por otro lado, los <strong>derechos patrimoniales</strong>, que permiten la explotación económica de la obra mediante reproducción, distribución, comunicación pública y transformación (Dirección Nacional de Derecho de Autor, s. f.; Gobierno de Colombia, 1982).</p>\n<p>La Constitución Política de Colombia reconoce en su artículo 61 la protección de la propiedad intelectual. Sobre esta base, la Ley 23 de 1982 desarrolló el régimen general de derecho de autor, mientras que la Decisión Andina 351 de 1993 armonizó aspectos comunes en el ámbito comunitario andino. La literatura institucional destaca que el derecho de autor también se relaciona con compromisos internacionales y con la necesidad de proteger la creación en entornos impresos y digitales (Universidad UTB, s. f.; Dirección Nacional de Derecho de Autor, s. f.).</p>\n<p>En el plano conceptual, un rasgo esencial del sistema colombiano es que el derecho nace automáticamente con la creación de la obra y no depende del registro. El registro cumple una función probatoria y de publicidad, pero no constitutiva. Esta característica es central para distinguir entre el origen del derecho y los mecanismos administrativos de su oponibilidad frente a terceros (Dirección Nacional de Derecho de Autor, s. f.).</p>\n\n<h3>Metodología</h3>\n<p>La investigación se desarrolló mediante un enfoque cualitativo, documental y descriptivo. Se revisaron fuentes normativas, institucionales y académicas de alta relevancia sobre el derecho de autor en Colombia, priorizando documentos oficiales de la Dirección Nacional de Derecho de Autor y textos jurídicos de referencia disponibles en repositorios académicos y portales institucionales (Dirección Nacional de Derecho de Autor, s. f.; Gobierno de Colombia, 1982; Scielo Colombia, 2017).</p>\n<p>El análisis se organizó en tres etapas. Primero, se identificaron las disposiciones jurídicas que estructuran el régimen colombiano. Segundo, se sistematizaron los elementos doctrinales más reiterados sobre objeto, titularidad, duración y registro. Tercero, se compararon los hallazgos institucionales con las implicaciones prácticas reportadas por fuentes académicas y de divulgación universitaria, con el fin de detectar tensiones entre norma y aplicación (Universidad UTB, s. f.; Scielo Colombia, 2017).</p>\n<p>Este diseño metodológico no pretende medir cuantitativamente el impacto del sistema, sino interpretar su arquitectura jurídica y su funcionalidad. En consecuencia, los resultados se presentan como una síntesis analítica sustentada en documentación verificable.</p>\n\n<h3>Resultados</h3>\n<p>Los hallazgos principales muestran que el derecho de autor en Colombia posee una base normativa sólida y un esquema institucional relativamente claro. En primer lugar, la protección se concede a obras literarias, artísticas y científicas originales. La DNDA señala que el derecho nace en el momento mismo de la creación y que no requiere formalidades para existir, aunque el registro sí es posible y gratuito (Dirección Nacional de Derecho de Autor, s. f.; Registro en Línea, s. f.).</p>\n<p>En segundo lugar, la titularidad originaria corresponde al autor, entendido como persona natural. La guía institucional precisa que el autor es el creador de la obra y que los derechos morales y patrimoniales derivan de esa calidad originaria (Dirección Nacional de Derecho de Autor, s. f.). Este criterio es importante porque evita confundir la autoría con la titularidad derivada por contrato, herencia o cesión.</p>\n<p>En tercer lugar, la duración de la protección varía según la naturaleza del titular y la clasificación de la obra. La normativa clásica citada por la doctrina colombiana establece una protección general por la vida del autor y ochenta años después de su fallecimiento para personas naturales; para ciertos supuestos de titularidad jurídica, el término puede computarse desde la publicación o divulgación autorizada, conforme a la regulación aplicable (Gobierno de Colombia, 1982; Dirección Nacional de Derecho de Autor, s. f.).</p>\n<p>En cuarto lugar, el registro tiene una función práctica relevante. La DNDA informa que el trámite es gratuito, puede hacerse en línea y constituye un mecanismo de publicidad y prueba útil para acreditar la existencia de la obra y la titularidad alegada (Dirección Nacional de Derecho de Autor, s. f.; Registro en Línea, s. f.).</p>\n<p>Las características más significativas del régimen pueden sintetizarse así:</p>\n<ul>\n  <li><strong>Protección automática:</strong> la obra queda amparada desde su creación.</li>\n  <li><strong>Centralidad del autor:</strong> el titular originario es la persona natural creadora.</li>\n  <li><strong>Doble contenido:</strong> existen derechos morales y patrimoniales.</li>\n  <li><strong>Registro no constitutivo:</strong> sirve como prueba y publicidad, no como fuente del derecho.</li>\n  <li><strong>Duración prolongada:</strong> la protección se extiende por un largo período posterior a la muerte del autor.</li>\n</ul>\n\n<h3>Discusión</h3>\n<p>Los resultados permiten observar una tensión estructural entre la amplitud de la protección normativa y la fragilidad de su cumplimiento práctico. Aunque el sistema colombiano reconoce expresamente la protección automática y la gratuidad del registro, persisten problemas de desconocimiento, informalidad contractual y circulación digital no autorizada. La existencia de una norma robusta no garantiza por sí sola un nivel alto de observancia social (Dirección Nacional de Derecho de Autor, s. f.; Universidad UTB, s. f.).</p>\n<p>Desde el punto de vista jurídico, la distinción entre derechos morales y patrimoniales sigue siendo una de las mayores fortalezas del modelo. Los derechos morales salvaguardan la identidad del autor frente a alteraciones o usurpaciones, mientras que los patrimoniales permiten la explotación económica de la obra. Esta dualidad responde a una concepción personalista del derecho de autor que ha sido especialmente influyente en América Latina (Scielo Colombia, 2017).</p>\n<p>Sin embargo, el entorno digital introduce retos nuevos. La facilidad de copia, edición y distribución de contenidos exige mecanismos de licenciamiento, educación jurídica y gestión institucional más ágiles. En este marco, la función de la DNDA como autoridad especializada cobra importancia estratégica, no solo para administrar registros, sino también para orientar a creadores y usuarios sobre buenas prácticas y cumplimiento normativo (Dirección Nacional de Derecho de Autor, s. f.).</p>\n<p>Otro punto debatible es el equilibrio entre protección y acceso. Un sistema demasiado restrictivo puede dificultar la circulación del conocimiento, mientras que uno excesivamente débil desincentiva la creación. Colombia, al mantener una duración extensa y reconocer amplias facultades al autor, opta por una protección fuerte, pero ello exige compensarlo con políticas de acceso, educación y uso legítimo de contenidos.</p>\n\n<h3>Conclusiones</h3>\n<p>El derecho de autor en Colombia se caracteriza por una arquitectura jurídica coherente, basada en la Constitución, la ley interna y la normatividad andina. Su rasgo distintivo más importante es que la protección surge automáticamente con la creación de la obra, sin necesidad de registro previo, aunque este último resulta útil como mecanismo probatorio y de publicidad (Dirección Nacional de Derecho de Autor, s. f.; Registro en Línea, s. f.).</p>\n<p>La investigación muestra que el sistema colombiano protege de manera diferenciada los derechos morales y patrimoniales, otorga centralidad al autor como persona natural y establece un plazo de protección prolongado. Estas características lo convierten en un régimen sólido desde el punto de vista normativo (Gobierno de Colombia, 1982; Scielo Colombia, 2017).</p>\n<p>No obstante, la eficacia real del modelo depende de su apropiación social y de la capacidad institucional para responder a los desafíos del entorno digital. En consecuencia, el debate actual sobre derecho de autor en Colombia no gira únicamente en torno a la existencia de la norma, sino a su adaptación frente a nuevas formas de creación, circulación y consumo cultural (Universidad UTB, s. f.; Dirección Nacional de Derecho de Autor, s. f.).</p>\n\n<h3>Referencias bibliográficas</h3>\n<p>Dirección Nacional de Derecho de Autor. s. f. <a href=\"https://www.derechodeautor.gov.co/es\" target=\"_blank\" rel=\"noopener noreferrer\">Dirección Nacional de Derechos de Autor: Inicio</a>.</p>\n<p>Dirección Nacional de Derecho de Autor. s. f. <a href=\"https://www.derechodeautor.gov.co/es/transparencia-y-acceso-informacion-publica/informacion-de-la-entidad/116-preguntas-y-respuestas-frecuentes/preguntas-y-respuestas-frecuentes\" target=\"_blank\" rel=\"noopener noreferrer\">Preguntas y respuestas frecuentes - Derecho de Autor</a>.</p>\n<p>Dirección Nacional de Derecho de Autor. 2024. <a href=\"https://www.derechodeautor.gov.co/sites/default/files/2024-03/Gu%C3%ADa-de-Derecho-de-Autor-para-creadores-y-usuarios.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Guía de Derecho de Autor para creadores y usuarios</a>.</p>\n<p>Gobierno de Colombia. 1982. <a href=\"https://www.coloriuris.net/_media/es:colombia.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Ley No. 23 de 1982 sobre derechos de autor</a>.</p>\n<p>Gobierno de Colombia. 1991. <a href=\"https://www.derechodeautor.gov.co/sites/default/files/2024-03/Cartilla%20derecho%20de%20autor%20(Alfredo%20Vega).pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Cartilla de derecho de autor</a>.</p>\n<p>Registro en Línea. s. f. <a href=\"https://registroenlinea.gov.co/\" target=\"_blank\" rel=\"noopener noreferrer\">Registro Virtual Dirección Nacional de Derecho de Autor</a>.</p>\n<p>Scielo Colombia. 2017. <a href=\"http://www.scielo.org.co/scielo.php?script=sci_arttext&amp;pid=S2145-77192017000200004\" target=\"_blank\" rel=\"noopener noreferrer\">Derechos de autor en Colombia</a>.</p>\n<p>Universidad UTB. s. f. <a href=\"https://www.utb.edu.co/blog/blog-de-investigaciones/propiedad-intelectual-y-derechos-de-autor/\" target=\"_blank\" rel=\"noopener noreferrer\">Conoce todo sobre propiedad intelectual y derechos de autor</a>.</p>\n                    </div>\n                </main>\n            </body>\n            </html>\n        ","Perfil.html":"<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Informe de Investigación</title><style>body{font-family: sans-serif; line-height: 1.6; margin: 2em;} h1, h2{color: #333;} h2{border-bottom: 1px solid #ccc; padding-bottom: 5px;} p, li{color: #444;}</style></head><body><h1>Plagio, reproducción y comunicación pública en entornos digitales: análisis desde el derecho de autor colombiano</h1><h2>Objetivo General</h2><p>Analizar, desde el derecho de autor colombiano, cómo se configuran jurídicamente las conductas de plagio, reproducción y comunicación pública en entornos digitales, identificando criterios normativos y jurisprudenciales para determinar responsabilidad y alcance de las limitaciones/excepciones aplicables.</p><h2>Objetivos Específicos</h2><ul><li>Caracterizar conceptualmente las categorías de plagio, reproducción y comunicación pública en el entorno digital, precisando sus elementos jurídicos a la luz del marco colombiano de derecho de autor.  </li><li>Examinar el tratamiento normativo y la interpretación jurisprudencial en Colombia para casos de uso de obras en plataformas, redes, repositorios y contenidos en línea, distinguiendo entre infracción, usos permitidos y posibles zonas grises.  </li><li>Proponer criterios de análisis y recomendaciones metodológicas para la calificación jurídica de casos (incluyendo evidencias digitales relevantes como metadatos, rastros de carga/descarga, trazabilidad y alcance del acceso al público).</li></ul><h2>Justificación</h2><p>La digitalización ha incrementado la facilidad de copiar, reutilizar y difundir obras, haciendo más frecuente la controversia sobre plagio, reproducción y comunicación pública. En Colombia, la aplicación práctica de estos conceptos enfrenta retos por la rápida evolución tecnológica y la necesidad de criterios claros para garantizar seguridad jurídica y protección efectiva de los titulares de derechos. Esta investigación aporta un análisis sistemático que puede orientar decisiones judiciales, administrativas y académicas, así como buenas prácticas de cumplimiento.</p><h2>Variables</h2><p><strong>Independiente:</strong> La configuración de conductas en entornos digitales (plagio/ reproducción/ comunicación pública) y su forma de realización técnica y operativa (p. ej., modo de copia, distribución, puesta a disposición y alcance del público).</p><p><strong>Dependiente:</strong> La determinación jurídica del tipo de infracción o responsabilidad en derecho de autor en Colombia (incluyendo la procedencia de excepciones/limitaciones y la calificación de la conducta como comunicación pública o reproducción).</p><h2>Enfoque Metodológico</h2><p>Cualitativa</p><h2>Preguntas de Investigación</h2><ol><li>1. ¿Cómo se configura jurídicamente la “reproducción” de obras en entornos digitales (p. ej., descargas, copias temporales, capturas de pantalla, cachés y almacenamiento en la nube) bajo el derecho de autor colombiano?  </li><li>2. ¿En qué escenarios la conducta de “comunicación pública” en internet (p. ej., carga de contenidos, enlaces, embedding, transmisión en streaming y puesta a disposición) cumple los elementos exigidos por la normatividad y la jurisprudencia colombiana?  </li><li>3. ¿Qué criterios permiten diferenciar el “plagio” (como fenómeno fáctico) de la infracción de derecho de autor por violación de derechos morales o patrimoniales, y qué importancia tiene el análisis de similitud, originalidad y accesibilidad?  </li><li>4. ¿Cómo operan y se interpretan en Colombia las limitaciones y excepciones al derecho de autor frente a usos digitales controvertidos (p. ej., fines de investigación, educación, cita, y parodia), y cuáles son sus límites cuando existe reproducción o comunicación en línea?  </li><li>5. ¿Qué estándares probatorios y de valoración se emplean en la práctica judicial y administrativa para determinar responsabilidad por plagio, reproducción y/o comunicación pública en internet (incluyendo el rol de intermediarios, prestadores de servicios y plataformas)?</li></ol></body></html>","reporte_Inv profunda.html":"\n                <!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Reporte: derecho de autor en colombia</title>\n                <style>\n        :root {\n            --bg-color: #1a1a2e;\n            --primary-color: #16213e;\n            --secondary-color: #0f3460;\n            --accent-color: #5372f0;\n            --text-color: #e4e4e4;\n            --header-text-color: #ffffff;\n            --border-color: #4a4a6a;\n            --input-bg-color: #2c2c44;\n            --button-hover-bg: #6f8cff;\n            --report-bg: #1e1e36;\n            --error-color: #ff6b6b;\n            --success-color: #7bed9f;\n            --success-color-dark: #2ed573;\n            --source-link-color: #a9bce2;\n            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n        }\n\n        body {\n            font-family: var(--font-family);\n            background-color: var(--bg-color);\n            color: var(--text-col olor);\n            border: 1px solid var(--border-color);\n            border-radius: 5px;\n            outline: none;\n            min-width: 200px;\n        }\n\n        #topicInput:focus {\n            border-color: var(--accent-color);\n            box-shadow: 0 0 5px var(--accent-color);\n        }\n\n        #researchButton {\n            padding: 0.75rem 1.5rem;\n            font-size: 1rem;\n            background-color: var(--accent-color);\n            color: var(--header-text-color);\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            transition: background-color 0.3s ease;\n            font-weight: 500;\n            white-space: nowrap;\n        }\n\n        #researchButton:hover:not(:disabled) {\n            background-color: var(--button-hover-bg);\n        }\n\n        #researchButton:disabled {\n            background-color: var(--secondary-color);\n            cursor: not-allowed;\n            opacity: 0.7;\n        }\n\n        .status-container {\n            margin-bottom: 2rem;\n            padding: 1rem;\n            background-color: var(--secondary-color);\n            border-radius: 5px;\n            border-left: 5px solid var(--accent-color);\n            min-height: 20px;\n        }\n\n        .status-update {\n            color: var(--text-color);\n            margin: 0.5rem 0;\n            font-style: italic;\n        }\n\n        .status-update span.dot-container {\n            display: inline-block;\n            width: 30px;\n        }\n\n        .status-update span.dot {\n            display: inline-block;\n            animation: blink 1.4s infinite both;\n            opacity: 0;\n            margin: 0 1px;\n        }\n\n        .status-update span.dot:nth-child(1) {\n            animation-delay: 0s;\n        }\n\n        .status-update span.dot:nth-child(2) {\n            animation-delay: .2s;\n        }\n\n        .status-update span.dot:nth-child(3) {\n            animation-delay: d;\n            padding: 0.5rem;\n            border-left: 3px solid var(--error-color);\n            background-color: rgba(255, 107, 107, 0.1);\n        }\n\n        .download-button {\n            display: block;\n            width: 100%;\n            margin-top: 1.5rem;\n            padding: 0.75rem 1.5rem;\n            font-size: 1rem;\n            background-color: var(--success-color-dark);\n            color: var(--header-text-color);\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            transition: background-color 0.3s ease;\n            font-weight: 500;\n        }\n\n        .download-button:hover {\n            background-color: var(--success-color);\n            color: var(--primary-color);\n        }\n\n        footer {\n            background-color: var(--primary-color);\n            color: var(--text-color);\n            text-align: center;\n            padding: 1rem;\n            font-size: 0.9rem;\n            margin-top: auto;\n            border-top: 1px solid var(--border-color);\n        }\n\n        ::-webkit-scrollbar {\n            width: 10px;\n        }\n\n        ::-webkit-scrollbar-track {\n            background: var(--secondary-color);\n            border-radius: 5px;\n        }\n\n        ::-webkit-scrollbar-thumb {\n            background: var(--accent-color);\n            border-radius: 5px;\n        }\n\n        ::-webkit-scrollbar-thumb:hover {\n            background: var(--button-hover-bg);\n        }\n     body { padding: 2rem; }</style>\n                <script>\n                window.MathJax = {\n                  tex: { inlineMath: [['\\\\(', '\\\\)']], displayMath: [['\\\\[', '\\\\]']] },\n                  svg: { fontCache: 'global' }\n                };\n                <\/script>\n                <script type=\"text/javascript\" id=\"MathJax-script\" async\n                  src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js\"><\/script>\n                </head><body><main><div class=\"report-container\" style=\"max-height: none; overflow-y: visible;\">\n                <h2>Derecho de Autor en Colombia</h2>\n\n<p>El derecho de autor en Colombia es el conjunto de normas y principios jurídicos que protegen los derechos de los creadores sobre sus obras literarias, artísticas y científicas. Su objetivo principal es fomentar la creación intelectual al garantizar a los autores el control sobre la explotación de sus obras y la atribución de su paternidad. La legislación colombiana en esta materia se encuentra principalmente consagrada en la <strong>Ley 23 de 1982</strong> y sus modificaciones posteriores, así como en tratados internacionales suscritos por el país.</p>\n\n<h3>Hallazgos Clave</h3>\n\n<h4>Objeto de Protección</h4>\n<p>El derecho de autor protege las creaciones originales del intelecto, independientemente de su forma de expresión, mérito artístico o destino. Esto incluye, pero no se limita a:</p>\n<ul>\n    <li>Obras literarias (libros, poemas, ensayos)</li>\n    <li>Obras artísticas (pinturas, esculturas, fotografías, obras arquitectónicas)</li>\n    <li>Obras musicales (composiciones con o sin letra)</li>\n    <li>Obras dramáticas y coreográficas</li>\n    <li>Obras audiovisuales (películas, videos)</li>\n    <li>Programas de ordenador (software)</li>\n    <li>Bases de datos</li>\n    <li>Obras de ilustración, mapas, planos, croquis y obras plásticas relativas a la geografía, la topografía o la ciencia.</li>\n</ul>\n\n<h4>Titularidad de los Derechos</h4>\n<p>El derecho de autor inicialmente recae sobre el autor de la obra. Sin embargo, estos derechos pueden ser transferidos, licenciados o cedidos a terceros. En el caso de obras colectivas o creadas bajo un contrato laboral, la titularidad puede variar según lo estipulado en la ley o en el acuerdo específico.</p>\n\n<h4>Derechos del Autor</h4>\n<p>Los derechos de autor se dividen en dos categorías principales:</p>\n<ul>\n    <li><strong>Derechos Morales:</strong> Son inalienables, irrenunciables e inembargables. Incluyen el derecho a:<p></p>\n        <ul>\n            <li>Reclamar la paternidad de la obra (ser reconocido como autor).</li>\n            <li>Oponerse a cualquier deformación, mutilación o modificación de la obra que cause perjuicio a su honor o reputación.</li>\n            <li>Divulgar la obra o mantenerla inédita.</li>\n            <li>Modificar la obra.</li>\n            <li>Retirar la obra del comercio.</li>\n        </ul>\n    </li>\n    <li><strong>Derechos Patrimoniales:</strong> Son susceptibles de transferencia, cesión o licencia, y otorgan al autor el derecho exclusivo a autorizar o prohibir:<p></p>\n        <ul>\n            <li>La reproducción de la obra.</li>\n            <li>La comunicación pública de la obra en cualquier forma.</li>\n            <li>La distribución de copias de la obra.</li>\n            <li>La transformación de la obra (adaptaciones, traducciones).</li>\n        </ul>\n    </li>\n</ul>\n\n<h4>Duración de la Protección</h4>\n<p>En Colombia, la duración de los derechos patrimoniales sobre una obra es, generalmente, la vida del autor más 80 años después de su muerte. Para obras en colaboración, el plazo se cuenta a partir de la muerte del último coautor. Para obras anónimas o seudónimas, la protección dura 80 años desde su primera publicación. Las obras del dominio público no están sujetas a derecho de autor.</p>\n\n<h4>Registro de Obras</h4>\n<p>Si bien el derecho de autor nace con la creación de la obra, el registro ante la Dirección Nacional de Derechos de Autor (DNDA) es recomendable. Proporciona un medio de prueba de la autoría y la fecha de creación, lo que facilita la defensa de los derechos en caso de infracción y la debida atribución.</p>\n\n<h4>Infracciones y Sanciones</h4>\n<p>El uso, reproducción, distribución o comunicación pública de una obra protegida sin la autorización del titular de los derechos constituye una infracción al derecho de autor. Las sanciones pueden ser de carácter civil (indemnización de perjuicios) y/o penal, dependiendo de la gravedad de la infracción y la intencionalidad.</p>\n\n<h4>Excepciones y Limitaciones</h4>\n<p>La ley contempla ciertas excepciones y limitaciones al derecho de autor, permitiendo el uso de obras protegidas sin autorización en casos específicos, como:</p>\n<ul>\n    <li>Citas para fines de crítica o reseña.</li>\n    <li>Uso para fines didácticos o de investigación (siempre que no sea para obtener lucro y se indique la fuente).</li>\n    <li>Reproducción de artículos de prensa o de obras publicadas en periódicos o revistas, en lo que concierne a la información de actualidad, y con indicación de la fuente.</li>\n    <li>Copia privada para uso personal y no comercial.</li>\n</ul>\n<p>Es fundamental que estos usos se realicen sin menoscabo de la explotación normal de la obra ni perjuicio injustificado de los intereses legítimos del autor.</p>\n\n<h3>Conclusión</h3>\n\n<p>El derecho de autor en Colombia es un pilar fundamental para la protección de los creadores y el fomento de la cultura y la innovación. Garantiza a los autores el control sobre la explotación de sus obras y el reconocimiento de su paternidad, al tiempo que contempla excepciones para el acceso y uso legítimo de las creaciones. La comprensión de estos derechos y obligaciones es esencial tanto para los creadores como para los usuarios de obras protegidas para asegurar un ecosistema creativo justo y dinámico en el país.</p>\n\n<h3>Fuentes consultadas</h3>\n<ul>\n    <li><a href=\"https://www.camara.gov.co/normativa/ley-23-de-1982/\" target=\"_blank\" rel=\"noopener noreferrer\">Ley 23 de 1982 - Congreso de Colombia</a></li>\n    <li><a href=\"https://www.secretariasenado.gov.co/senado/basedocs/ley_0666_2001.html\" target=\"_blank\" rel=\"noopener noreferrer\">Ley 666 de 2001 - Congreso de Colombia</a></li>\n    <li><a href=\"https://www.dnda.gov.co/es/derecho-de-autor/marco-legal/\" target=\"_blank\" rel=\"noopener noreferrer\">Marco Legal - Dirección Nacional de Derechos de Autor (DNDA)</a></li>\n    <li><a href=\"https://wipolex.wipo.int/es/text/356139\" target=\"_blank\" rel=\"noopener noreferrer\">Convenio de Berna para la Protección de las Obras Literarias y Artísticas (Versión Española)</a></li>\n    <li><a href=\"https://wipolex.wipo.int/es/text/357036\" target=\"_blank\" rel=\"noopener noreferrer\">Tratado de la OMPI sobre Derecho de Autor (WCT)</a></li>\n    <li><a href=\"https://www.cancilleria.gov.co/tramites_servicios/relaciones_internacionales/convenios_multilaterales/tratados_bilaterales\" target=\"_blank\" rel=\"noopener noreferrer\">Tratados Multilaterales Suscritos por Colombia - Cancillería de Colombia</a></li>\n</ul>\n                </div></main></body></html>"};
