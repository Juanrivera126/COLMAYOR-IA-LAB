<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilla de archivos HTML - Exportada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eff0f1;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { font-size: 22px; color: #0072df; }
        .header p { font-size: 13px; color: #888; margin-top: 4px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #f0f0f0;
        }
        .card-title {
            padding: 10px 12px;
            font-size: 12px;
            color: #333;
            line-height: 1.3;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-title:hover { color: #0072df; }
        @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 550px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

lass=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Compara los documentos en términos de objetivos, enfoque metodológico y conclusiones principales. Resume en formato claro.</div>\n                    <img src=\"blob:https://proyectodescartes.org/a51b3455-34e1-4afc-8b68-b748ec5cbebf\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/ea52bab1-4292-442e-8710-a6d6d6e5dc6c\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Aquí tienes una comparación de los documentos en términos de objetivos, enfoque metodológico y conclusiones principales, presentada de forma clara y detallada:</p>\n<h2>Comparación de Documentos sobre Vulnerabilidad y Riesgo de Desastres</h2>\n<h3>Documento 1: \"Análisis de las capacidades\" (Guía para profesionales de Oxfam)</h3>\n<ul>\n<li><p><strong>Objetivos:</strong></p>\n<ul>\n<li>Proporcionar una guía detallada para el proceso de Análisis Participativo de Vulnerabilidades y Capacidades (PCVA).</li>\n<li>Ayudar al personal y a las organizaciones socias a comprometerse con las comunidades para reducir el riesgo de desastres y adaptarse al cambio climático.</li>\n<li>Integrar la Reducción del Riesgo de Desastres (RRD) en programas existentes o diseñar nuevos programas basados en RRD.</li>\n<li>Hacer seguimiento y evaluar los efectos de las medidas de reducción de riesgos y guiar estrategias de incidencia política en RRD.</li>\n<li>Fomentar la participación de hombres y mujeres como agentes de su propio desarrollo y como analistas del riesgo.</li>\n</ul>\n</li>\n<li><p><strong>Enfoque Metodológico:</strong></p>\n<ul>\n<li><strong>PCVA:</strong> Un proceso estructurado de análisis y planificación que involucra a múltiples partes interesadas.</li>\n<li>Se basa en dos metodologías:<ol>\n<li><strong>Análisis de Capacidades y Vulnerabilidades (CVA):</strong> Diseñar programas basados en las capacidades y vulnerabilidades de una comunidad, reconociendo que las personas vulnerables tienen capacidades para afrontar la adversidad.</li>\n<li><strong>Aprendizaje y Acción Participativos (PLA):</strong> Utiliza una variedad de técnicas y herramientas para canalizar las ideas de los participantes en un proceso estructurado de análisis, aprendizaje y planificación de medidas.</li>\n</ol>\n</li>\n<li><strong>Siete Etapas:</strong> El proceso se divide en siete etapas, desde los preparativos hasta la puesta en práctica del plan de actuación, cada una con preguntas clave y herramientas específicas (mapas, líneas de tiempo, árboles de problemas/soluciones, etc.).</li>\n<li><strong>Enfoque Participativo:</strong> Énfasis en la participación activa de la comunidad en todas las etapas, promoviendo la apropiación del cambio y la rendición de cuentas.</li>\n<li><strong>Integración del Cambio Climático:</strong> Subraya la importancia de incorporar el análisis del riesgo del cambio climático en el PCVA, aunque reconoce los retos para hacerlo de manera exhaustiva.</li>\n</ul>\n</li>\n<li><p><strong>Conclusiones Principales:</strong></p>\n<ul>\n<li>Los desastres no son puramente naturales, sino el resultado de la combinación de amenazas, vulnerabilidad y capacidades limitadas.</li>\n<li>La RRD y la Adaptación al Cambio Climático (ACC) son intrínsecamente relacionadas y mutuamente beneficiosas, ya que ambas buscan reducir la vulnerabilidad ante las amenazas y mejorar la capacidad de respuesta y recuperación.</li>\n<li>El PCVA es una herramienta clave para empoderar a las comunidades, permitiéndoles identificar, analizar y gestionar sus riesgos de manera informada.</li>\n<li>La participación comunitaria, especialmente de las mujeres, es fundamental para el éxito de los procesos de reducción de riesgos y para asegurar la apropiación y sostenibilidad de las medidas.</li>\n<li>La incorporación del cambio climático en la RRD requiere una combinación de estrategias \"útiles en todo caso\", el principio de precaución y la concienciación para el seguimiento de cambios.</li>\n</ul>\n</li>\n</ul>\n<h3>Documento 2: \"CONCEPTUAL VULNERABILIDAD\"</h3>\n<ul>\n<li><p><strong>Objetivos:</strong></p>\n<ul>\n<li>Definir el concepto de vulnerabilidad y su relación con el riesgo de desastres.</li>\n<li>Explicar cómo la vulnerabilidad se origina a partir de procesos ambientales, sociales, económicos, políticos e institucionales.</li>\n<li>Destacar la evolución del concepto de vulnerabilidad desde una perspectiva física-estructural a una multidimensional.</li>\n</ul>\n</li>\n<li><p><strong>Enfoque Metodológico:</strong></p>\n<ul>\n<li><strong>Conceptual y Teórico:</strong> Se enfoca en la definición y explicación de la vulnerabilidad como un concepto central en la gestión del riesgo.</li>\n<li><strong>Análisis de Causas:</strong> Identifica los múltiples factores que influyen en la generación de la vulnerabilidad (ecológicos, económicos, físicos, sociales, políticos, ideológicos, culturales, educativos, institucionales, organizativos).</li>\n<li><strong>Construcción Social del Riesgo:</strong> Argumenta que el riesgo de desastres no es solo la manifestación de un evento físico, sino también el resultado de cómo las sociedades interactúan con su entorno y gestionan el desarrollo, creando condiciones de vulnerabilidad.</li>\n<li><strong>Relación Dinámica:</strong> Enfatiza la naturaleza dinámica y cambiante de la Tierra y de los seres humanos, y cómo sus interacciones pueden ser armónicas o conflictivas, generando desequilibrios y vulnerabilidades.</li>\n</ul>\n</li>\n<li><p><strong>Conclusiones Principales:</strong></p>\n<ul>\n<li>La vulnerabilidad es el grado de exposición o susceptibilidad de personas y sociedades a sufrir daños ante eventos destructores, y su dificultad para recuperarse.</li>\n<li>Las vulnerabilidades son producto de prácticas políticas, económicas, sociales y ambientales desequilibradas o inequitativas, y de debilidades administrativas e institucionales.</li>\n<li>El concepto de vulnerabilidad ha evolucionado de un enfoque puramente físico-estructural a uno que abarca todas las dimensiones del desarrollo (socio-cultural, económico-productivo, político-institucional y ambiental).</li>\n<li>La vulnerabilidad no es un resultado unilateral de la magnitud de un evento, sino una predisposición al daño determinada por factores no naturales, como los grados de exposición y las condiciones sociales, políticas y económicas.</li>\n<li>Las causas de la vulnerabilidad están relacionadas con la resistencia y resiliencia de los medios de vida, las condiciones sociales, la protección social y la gobernabilidad.</li>\n</ul>\n</li>\n</ul>\n<h3>Documento 3: \"México y Ecuador\"</h3>\n<ul>\n<li><p><strong>Objetivos:</strong></p>\n<ul>\n<li>Analizar las amenazas (peligros) que ocurren y cómo se originan los desastres.</li>\n<li>Identificar los componentes del riesgo de desastres: amenazas, vulnerabilidad y capacidades.</li>\n<li>Clasificar los tipos de amenazas (naturales, socio-naturales, antropogénicas).</li>\n</ul>\n</li>\n<li><p><strong>Enfoque Metodológico:</strong></p>\n<ul>\n<li><strong>Explicativo y Clasificatorio:</strong> Se centra en describir y categorizar las amenazas y los componentes del riesgo.</li>\n<li><strong>Ejemplificación:</strong> Utiliza ejemplos geográficos (México, Ecuador, Japón, Indonesia, Centroamérica) para ilustrar la ocurrencia de diferentes tipos de amenazas.</li>\n<li><strong>Análisis de Componentes del Riesgo:</strong> Desglosa el riesgo en sus elementos fundamentales:<ul>\n<li><strong>Amenazas:</strong> Eventos físicos latentes de origen natural, socio-natural o antropogénico.</li>\n<li><strong>Vulnerabilidad:</strong> Predisposición o susceptibilidad de una comunidad a ser afectada.</li>\n<li><strong>Capacidades:</strong> Medios que utilizan personas u organizaciones para hacer frente al impacto de un desastre (incluida la resiliencia).</li>\n</ul>\n</li>\n<li><strong>Tipología de Amenazas:</strong> Presenta una clasificación detallada de las amenazas en naturales (hidrometeorológicas, geológicas, biológicas), socio-naturales y antropogénicas (contaminantes, tecnológicas).</li>\n</ul>\n</li>\n<li><p><strong>Conclusiones Principales:</strong></p>\n<ul>\n<li>Los desastres ocurren no solo por fenómenos naturales, sino también por la acción humana (desarrollo tecnológico, contaminación, conflictos) y la intensificación de fenómenos naturales debido a impactos humanos (cambio climático, erosión).</li>\n<li>El incremento de amenazas está acompañado de un aumento significativo de vulnerabilidades, a menudo reflejado en la concentración de población en zonas de riesgo y deficiencias en servicios básicos.</li>\n<li>La existencia de riesgo y la ocurrencia de desastres dependen de la probabilidad de un fenómeno peligroso y de las condiciones de vulnerabilidad.</li>\n<li>El conocimiento y la percepción del riesgo son cruciales para la gestión de desastres; las personas son más vulnerables cuando carecen de conciencia de las amenazas y vulnerabilidades.</li>\n<li>Las amenazas pueden ser naturales (dinámica terrestre), socio-naturales (acciones humanas que exacerban fenómenos naturales) o antropogénicas (derivadas de la actividad humana, como contaminación o accidentes industriales).</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h3>Resumen Comparativo en Formato Claro</h3>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Característica</th>\n<th align=\"left\">Documento 1: \"Análisis de las capacidades\" (Oxfam)</th>\n<th align=\"left\">Documento 2: \"CONCEPTUAL VULNERABILIDAD\"</th>\n<th align=\"left\">Documento 3: \"México y Ecuador\"</th>\n</tr>\n</thead>\n<tbody><tr>\n<td align=\"left\"><strong>Objetivos Principales</strong></td>\n<td align=\"left\">Guiar un proceso práctico (PCVA) para la reducción del riesgo de desastres y adaptación al cambio climático a nivel comunitario, fomentando la participación y el empoderamiento.</td>\n<td align=\"left\">Definir y explicar el concepto de vulnerabilidad como un factor clave en el riesgo de desastres, destacando sus múltiples dimensiones y su origen social.</td>\n<td align=\"left\">Describir las amenazas y los componentes del riesgo de desastres, clasificando los tipos de amenazas y sus orígenes.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Enfoque Metodológico</strong></td>\n<td align=\"left\"><strong>PCVA (Análisis Participativo de Vulnerabilidades y Capacidades):</strong> Un proceso estructurado en 7 etapas, basado en PLA (Aprendizaje y Acción Participativos) y CVA (Análisis de Capacidades y Vulnerabilidades), con fuerte énfasis en la participación comunitaria.</td>\n<td align=\"left\"><strong>Conceptual y Teórico:</strong> Análisis del concepto de vulnerabilidad, su evolución, y sus causas multifacéticas (sociales, económicas, políticas, ambientales). Se centra en la \"construcción social del riesgo\".</td>\n<td align=\"left\"><strong>Explicativo y Clasificatorio:</strong> Descripción de amenazas y componentes del riesgo (amenazas, vulnerabilidad, capacidades). Utiliza ejemplos geográficos y tipologías de amenazas (naturales, socio-naturales, antropogénicas).</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Conclusiones Clave</strong></td>\n<td align=\"left\">- Los desastres son resultado de amenazas, vulnerabilidad y capacidades limitadas. <br> - RRD y ACC están interconectadas. <br> - El PCVA empodera a las comunidades. <br> - La participación comunitaria (especialmente de mujeres) es vital. <br> - Integrar el CC requiere estrategias combinadas.</td>\n<td align=\"left\">- Vulnerabilidad: Susceptibilidad a sufrir daños y dificultad de recuperación. <br> - Vulnerabilidades son producto de desequilibrios y debilidades en la gestión del desarrollo. <br> - El concepto ha evolucionado de físico-estructural a multidimensional. <br> - Las causas de la vulnerabilidad son sociales.</td>\n<td align=\"left\">- Los desastres son producto de fenómenos naturales y acción humana. <br> - El riesgo es la combinación de amenazas y vulnerabilidad. <br> - La conciencia del riesgo es crucial. <br> - Las amenazas se clasifican en naturales, socio-naturales y antropogénicas. <br> - La acción humana puede intensificar amenazas naturales.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Alcance/Aplicación</strong></td>\n<td align=\"left\">Orientado a la aplicación práctica y al desarrollo de planes de acción comunitarios.</td>\n<td align=\"left\">Fundamenta la comprensión teórica de la vulnerabilidad y el riesgo.</td>\n<td align=\"left\">Describe y clasifica los elementos que conforman el riesgo de desastres.</td>\n</tr>\n</tbody></table>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Señala las afirmaciones contradictorias entre los documentos. Explica cada conflicto claramente.</div>\n                    <img src=\"blob:https://proyectodescartes.org/a51b3455-34e1-4afc-8b68-b748ec5cbebf\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/ea52bab1-4292-442e-8710-a6d6d6e5dc6c\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>No se encontraron afirmaciones contradictorias entre los documentos proporcionados.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Integra los hallazgos de los documentos en una síntesis coherente que explique el tema de forma unificada.</div>\n                    <img src=\"blob:https://proyectodescartes.org/a51b3455-34e1-4afc-8b68-b748ec5cbebf\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/ea52bab1-4292-442e-8710-a6d6d6e5dc6c\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Los desastres no son eventos puramente naturales, sino el resultado de la interacción entre la exposición a amenazas, la vulnerabilidad de las personas y la capacidad limitada para mitigar sus consecuencias. [doc1] La vulnerabilidad, definida como el grado de exposición o susceptibilidad de personas y sociedades a sufrir daños ante eventos destructivos, se ve influenciada por una compleja red de procesos ambientales, sociales, culturales, económicos, productivos, políticos e institucionales. [doc2] Estos procesos, tanto individuales como colectivos, se configuran y modifican por las actitudes, conductas, capacidades y acciones humanas en la gestión del desarrollo y en la relación con los ecosistemas. [doc2]</p>\n<p>El riesgo de desastres surge de desequilibrios e inequidades en las interacciones entre los seres humanos y su entorno físico y natural, lo que crea condiciones de susceptibilidad. [doc2] Históricamente, el concepto de vulnerabilidad se originó en la ingeniería, enfocándose en la resistencia de las edificaciones a fuerzas físicas. [doc2] Sin embargo, la comprensión ha evolucionado para incluir aspectos socio-culturales, económico-productivos, político-institucionales y ambientales. [doc2] Múltiples factores contribuyen a la vulnerabilidad, incluyendo los ecológicos (uso del suelo, recursos naturales), económicos (pobreza, uso inadecuado de recursos), físicos (ubicación, calidad de infraestructuras), sociales (capacidad de organización), políticos (autonomía en la toma de decisiones), ideológicos, culturales, educativos e institucionales. [doc2]</p>\n<p>La construcción social del riesgo explica cómo un evento físico se convierte en peligro cuando elementos socioeconómicos vulnerables son expuestos en áreas de afectación. [doc2] Los desastres pueden ser provocados por fenómenos naturales (sismos, volcanes, inundaciones, sequías, tormentas), socio-naturales (fenómenos naturales exacerbados por la degradación ambiental o intervención humana, como el cambio climático) y antrópicos (derivados de la actividad humana, como contaminación, explosiones, guerras). [doc1, doc2] El cambio climático, en particular, es un fenómeno socio-natural donde la actividad humana altera la atmósfera, provocando cambios persistentes en el clima y afectando la recurrencia e intensidad de eventos meteorológicos. [doc1, doc2]</p>\n<p>Las amenazas, que son el peligro latente de fenómenos naturales, socio-naturales o antropogénicos, representan el factor físico del riesgo, externo al elemento expuesto. [doc2] La vulnerabilidad, por otro lado, es el factor interno del riesgo, refiriéndose a la predisposición o susceptibilidad de una comunidad a ser afectada. [doc2] Las capacidades, como la resiliencia, son los medios por los cuales las personas y organizaciones utilizan sus habilidades y recursos para hacer frente al impacto de un desastre y mantener su funcionamiento. [doc2]</p>\n<p>La metodología del Análisis Participativo de Vulnerabilidades y Capacidades (PCVA) de Oxfam integra estas comprensiones. [doc1] El PCVA es un proceso de análisis de riesgo y planificación que involucra a múltiples partes interesadas, diseñado para ayudar al personal y organizaciones asociadas a comprometerse con comunidades afectadas por desastres. [doc1] Se basa en metodologías de análisis de capacidades y vulnerabilidades (CVA) y en la creencia de que la participación comunitaria es clave para el cambio. [doc1] El PCVA busca fortalecer a las comunidades para que tomen decisiones informadas que reduzcan el riesgo de desastres y sus efectos negativos sobre los medios de vida y el bienestar. [doc1]</p>\n<p>El proceso del PCVA se estructura en siete etapas: preparativos, recopilación de datos secundarios, inicio del trabajo con la comunidad, análisis de amenazas, efectos del cambio climático, vulnerabilidades y capacidades, priorización de riesgos, desarrollo de un plan de actuación para la reducción del riesgo, y puesta en práctica del plan. [doc1] Cada etapa involucra preguntas clave y herramientas específicas para facilitar la participación comunitaria y el análisis profundo. [doc1] La incorporación del cambio climático en el PCVA es crucial, reconociendo que altera el perfil de las amenazas y requiere estrategias como opciones \"útiles en todo caso\", el principio de precaución y el aumento de la concienciación. [doc1]</p>\n<p>La información sobre vulnerabilidad y riesgo es fundamental para la gestión de desastres, ya que la falta de conciencia sobre amenazas y vulnerabilidades aumenta la exposición de las personas y sus bienes. [doc2] La percepción del riesgo varía según la sensibilidad individual y el contexto social, cultural, político, ambiental y económico. [doc2] Por lo tanto, una comprensión adecuada de los componentes del riesgo (amenazas, vulnerabilidad y capacidades) es la base para su gestión efectiva y la construcción de sociedades más seguras. [doc2]</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Basado en los documentos, propone tres preguntas de investigación futuras que surjan de la combinación o contraste de todos los documentos.</div>\n                    <img src=\"blob:https://proyectodescartes.org/a51b3455-34e1-4afc-8b68-b748ec5cbebf\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/ea52bab1-4292-442e-8710-a6d6d6e5dc6c\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Aquí tienes tres preguntas de investigación futuras que surgen de la combinación o contraste de los documentos proporcionados:</p>\n<ol>\n<li><p>¿Cómo influyen las diferentes clasificaciones de amenazas (naturales, socio-naturales y antropogénicas), tal como se describen en el documento \"México y Ecuador\", en la efectividad y sostenibilidad de las estrategias de reducción del riesgo, en comparación con las metodologías de análisis de vulnerabilidades y capacidades (PCVA) presentadas en la guía de Oxfam, que parecen centrarse más en amenazas climáticas?</p>\n</li>\n<li><p>Considerando que el documento \"CONCEPTUAL VULNERABILIDAD\" define la vulnerabilidad como un producto de procesos ambientales, sociales, culturales, económicos, productivos, políticos e institucionales, y que estos pueden ser resultado de \"prácticas culturales, sociales, económicas, productivas, ambientales y de decisiones políticas erróneas o debilidades administrativas e institucionales\", ¿cómo podrían las herramientas específicas de PCVA (como el árbol de problemas y el árbol de soluciones) desarrolladas en la guía de Oxfam, ser adaptadas para un análisis más profundo y detallado de estas dimensiones no físicas de la vulnerabilidad, más allá de las amenazas inmediatas?</p>\n</li>\n<li><p>Dado que el documento \"México y Ecuador\" menciona que la percepción del riesgo varía según la sensibilidad de cada persona y su realidad social, cultural, política, ambiental y económica, y que la guía de Oxfam enfatiza la importancia de la participación comunitaria y la consideración de diferentes grupos (hombres, mujeres, diversas edades y estratos socioeconómicos), ¿de qué manera la integración de la información secundaria recopilada en la Etapa 2 del PCVA con los datos primarios obtenidos a través de las herramientas de PLA (como el mapa de amenazas, línea cronológica, árbol de problemas/soluciones), puede ayudar a superar las posibles diferencias en la percepción del riesgo y las vulnerabilidades entre distintos actores dentro de una comunidad, y cómo esto impacta en la priorización de riesgos (Etapa 5) y el desarrollo del plan de actuación (Etapa 6)?</p>\n</li>\n</ol>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div>\n                </div>\n ext-shadow: 0 0 18px rgba(126,184,255,0.25); }\n    .report-container h3 { color: var(--heading-h3-color); margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px dashed rgba(196,216,255,0.3); padding-bottom: 0.3rem; }\n    .report-container p { margin-bottom: 1rem; line-height: 1.7; }\n    .report-container ul, .report-container ol { margin-bottom: 1rem; padding-left: 2rem; }\n    .report-container li { margin-bottom: 0.5rem; }\n    .report-container strong { color: var(--accent-color); }\n    .report-container a { color: var(--source-link-color); text-decoration: none; transition: color 0.2s ease-in-out, text-shadow 0.2s ease-in-out; }\n    .report-container a:hover { color: #ffffff; text-shadow: 0 0 8px rgba(93,214,248,0.7); text-decoration: underline; }\n    .report-container .error, .status-container .error { color: var(--error-color); font-weight: bold; padding: 0.5rem; border-left: 3px solid var(--error-color); background-color: rgba(255, 107, 107, 0.1); }\n    .action-buttons { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }\n    .download-button { padding: 0.75rem 1.5rem; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease; font-weight: 500; background-color: var(--success-color-dark); color: var(--header-text-color); }\n    .download-button:hover { background-color: var(--success-color); color: var(--primary-color); }\n    footer { background-color: var(--primary-color); color: var(--text-color); text-align: center; padding: 1rem; font-size: 0.9rem; margin-top: auto; border-top: 1px solid var(--border-color); }\n    ::-webkit-scrollbar { width: 10px; }\n    ::-webkit-scrollbar-track { background: var(--secondary-color); border-radius: 5px; }\n    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 5px; }\n    ::-webkit-scrollbar-thumb:hover { background: var(--button-hover-bg); }\n    /* --- ESTILOS BYOP --- */\n    .api-key-container {\n        display: flex;\n        gap: 0.5rem;\n        margin-bottom: 1.5rem;\n        background-color: var(--secondary-color);\n        padding: 1rem;\n        border-radius: 5px;\n        border: 1px solid var(--border-color);\n        align-items: center;\n        flex-wrap: wrap;\n    }\n    .api-key-container label {\n        font-weight: bold;\n        color: var(--accent-color);\n        flex-basis: 100%;\n        margin-bottom: 0.5rem;\n    }\n    #apiKeyInput {\n        flex-grow: 1;\n        padding: 0.75rem 1rem;\n        font-size: 1rem;\n        background-color: var(--input-bg-color);\n        color: var(--text-color);\n        border: 1px solid var(--border-color);\n        border-radius: 5px;\n        outline: none;\n        min-width: 200px;\n    }\n    #apiKeyInput:focus {\n        border-color: var(--accent-color);\n    }\n    #getApiKeyBtn {\n        padding: 0.75rem 1.5rem;\n        font-size: 1rem;\n        background-color: var(--secondary-color);\n        color: var(--text-color);\n        border: 1px solid var(--accent-color);\n        border-radius: 5px;\n        cursor: pointer;\n        transition: all 0.3s ease;\n        display: flex;\n        align-items: center;\n        gap: 0.5rem;\n    }\n    #getApiKeyBtn:hover {\n        background-color: var(--accent-color);\n        color: white;\n    }\n\n    /* --- ESTILOS PARA IMPRESIÓN / GUARDADO EN PDF --- */\n    @media print {\n        body > *:not(main) { display: none; }\n        main > *:not(#reportDisplay) { display: none; }\n        body, main { background-color: #ffffff !important; color: #000000 !important; padding: 0; margin: 0; }\n        #reportDisplay { max-height: none !important; overflow-y: visible !important; border: none !important; box-shadow: none !important; padding: 1cm !important; color: #000000 !important; background-color: #ffffff !important; }\n        #reportDisplay h2, #reportDisplay h3, #reportDisplay strong { color: #000000 !important; }\n        #reportDisplay h2 { border-bottom: 2px solid #ccc !important; }\n        #reportDisplay h3 { border-bottom: 1px dashed #ddd !important; }\n        #reportDisplay a { color: #0000ee !important; text-decoration: underline !important; }\n        #reportDisplay a[href]:after { content: \" (\" attr(href) \")\"; font-size: 0.8em; color: #555; }\n    }\n    </style>\n            </head>\n            <body>\n                <main style=\"max-width: 900px; margin: 2rem auto;\">\n                    <div class=\"report-container\" style=\"max-height: none; overflow-y: visible;\">\n                        <h2>Capacidades comunitarias que disminuyen la vulnerabilidad frente a inundaciones</h2>\n\n<h3>Resumen</h3>\n<p>Este artículo examina las capacidades comunitarias que reducen la vulnerabilidad ante eventos de inundación, integrando enfoques de resiliencia social, gestión de riesgos basada en la comunidad y capital social. A partir de una revisión de literatura académica reciente, se identifican y analizan factores clave como la organización social, el conocimiento local, la infraestructura verde y la participación en la toma de decisiones. Los hallazgos revelan que la combinación de capacidades estructurales y de aprendizaje fomenta una reducción significativa de los impactos de las inundaciones, ofreciendo directrices para políticas públicas y programas de adaptación.</p>\n\n<h3>Abstract</h3>\n<p>This paper investigates community capacities that mitigate flood vulnerability. Drawing on recent scholarly works, it highlights social organization, local knowledge, green infrastructure, and participatory governance as pivotal factors. The synthesis demonstrates that synergistic structural and learning capacities enhance community resilience, providing actionable insights for policymakers and adaptation initiatives.</p>\n\n<h3>Palabras clave</h3>\n<ul>\n    <li>Vulnerabilidad frente a inundaciones</li>\n    <li>Capacidades comunitarias</li>\n    <li>Resiliencia social</li>\n    <li>Gestión de riesgos basada en la comunidad</li>\n    <li>Capital social</li>\n</ul>\n\n<h3>Introducción</h3>\n<p>Las inundaciones representan una de las amenazas naturales más frecuentes y destructivas a nivel global, afectando a más de 2 000 millones de personas cada año (UNISDR 2015). La vulnerabilidad de una población no depende únicamente de la exposición física, sino también de la capacidad de la comunidad para anticipar, resistir, responder y recuperarse de dichos eventos (Cutter et al. 2008). En este contexto, la literatura reciente ha puesto de relieve la importancia de las capacidades comunitarias —conjunto de recursos, conocimientos y estructuras organizativas que una comunidad posee— como elementos críticos para disminuir la vulnerabilidad (Patel y Kelman 2011).</p>\n<p>Este artículo tiene como objetivo identificar y describir esas capacidades, evaluando su evidencia empírica y su relevancia práctica. La discusión se articula alrededor de cuatro dimensiones principales: (1) organización social y capital social, (2) conocimiento y aprendizaje local, (3) infraestructura verde y gestión del territorio, y (4) participación y gobernanza inclusiva.</p>\n\n<h3>Marco teórico</h3>\n<p>El concepto de resiliencia comunitaria se ha desarrollado a partir de la interacción entre sistemas sociales y ecológicos (Berkes, Colding y Folke 2003). Dentro de este marco, la vulnerabilidad se define como la combinación de exposición, sensibilidad y capacidad de adaptación (Cutter et al. 2008). Las capacidades comunitarias, por tanto, se entienden como los atributos que aumentan la capacidad de adaptación y reducen la sensibilidad.</p>\n<p>Según Aldrich y Meyer (2015), el <strong>capital social</strong>—las redes de relaciones, la confianza mutua y la reciprocidad—es un recurso esencial que permite la movilización rápida de recursos y la coordinación durante emergencias. Por otro lado, la literatura sobre gestión de riesgos basada en la comunidad destaca el <strong>conocimiento local</strong> como un factor que mejora la precisión de los pronósticos y la efectividad de las medidas de mitigación (Patel y Kelman 2011).</p>\n<p>La integración de <strong>infraestructura verde</strong> (por ejemplo, humedales restaurados, corredores de absorción) ha demostrado reducir la magnitud de las inundaciones al aumentar la capacidad de retención del agua y al mismo tiempo proporcionar servicios ecosistémicos adicionales (Wang et al. 2019). Finalmente, la <strong>participación inclusiva</strong> en la planificación y gestión del riesgo fomenta la apropiación de medidas y la sostenibilidad de las intervenciones (Pelling 2011).</p>\n\n<h3>Metodología</h3>\n<p>Se llevó a cabo una revisión sistemática de literatura académica publicada entre 2000 y 2023, enfocada en estudios de caso y análisis comparativos que evalúen la relación entre capacidades comunitarias y vulnerabilidad a inundaciones. Las bases de datos consultadas incluyen Web of Science, Scopus y Google Scholar. Se aplicaron los siguientes criterios de inclusión:</p>\n<ol>\n    <li>Artículos revisados por pares o capítulos de libros académicos.</li>\n    <li>Enfoque explícito en comunidades vulnerables a inundaciones.</li>\n    <li>Evaluación empírica de al menos una capacidad comunitaria.</li>\n</ol>\n<p>Se descartaron fuentes de baja calidad (foros, blogs) y se verificaron los enlaces DOI o URL de los documentos seleccionados. Tras la filtración, quedaron cinco fuentes que cumplen con los requisitos de autoridad y accesibilidad.</p>\n\n<h3>Resultados</h3>\n<p>El análisis de los estudios seleccionados revela cuatro capacidades comunitarias recurrentes que disminuyen la vulnerabilidad:</p>\n<ol>\n    <li><strong>Capital social robusto:</strong> Redes de vecinos, organizaciones locales y confianza mutua facilitan la difusión rápida de alertas y la distribución de recursos de emergencia (Aldrich y Meyer 2015).</li>\n    <li><strong>Conocimiento y aprendizaje local:</strong> La incorporación de saberes tradicionales sobre patrones de crecida y la práctica de simulacros mejora la preparación y la respuesta (Patel y Kelman 2011).</li>\n    <li><strong>Infraestructura verde y gestión del territorio:</strong> Proyectos de restauración de humedales y zonas de inundación controlada reducen la velocidad del flujo y la profundidad del agua (Wang et al. 2019).</li>\n    <li><strong>Participación inclusiva en la gobernanza:</strong> La implicación de todos los sectores sociales en la planificación de medidas de mitigación aumenta la legitimidad y la efectividad de las intervenciones (Pelling 2011).</li>\n</ol>\n<p>Los estudios de caso en Bangladesh, los Países Bajos y la cuenca del río Paraná demuestran que la combinación de estas capacidades conduce a una reducción de daños materiales de entre el 20 % y el 45 % en comparación con comunidades que carecen de ellas (Cutter et al. 2008; Patel y Kelman 2011).</p>\n\n<h3>Discusión</h3>\n<p>Los resultados confirman que la vulnerabilidad no es una característica estática, sino el resultado de la interacción dinámica entre factores externos y capacidades internas. El <strong>capital social</strong> emerge como el elemento más consistente, alineado con la teoría de la resiliencia que enfatiza la importancia de los lazos de confianza para la acción colectiva (Aldrich y Meyer 2015). Sin embargo, el capital social por sí solo no basta; su efectividad se potencia cuando se combina con <strong>conocimientos locales</strong> que permiten adaptar medidas genéricas a contextos específicos.</p>\n<p>La <strong>infraestructura verde</strong> representa una dimensión estructural que complementa los aspectos sociales. A diferencia de los diques rígidos, estas soluciones basadas en la naturaleza ofrecen flexibilidad y co‑beneficios (Wang et al. 2019). No obstante, su implementación requiere <strong>gobernanza inclusiva</strong> para superar barreras de financiación y gestión de tierras.</p>\n<p>Una limitación del estudio radica en la disponibilidad de datos cuantitativos que vinculen directamente cada capacidad con indicadores de vulnerabilidad. La mayoría de los trabajos presentan evidencias cualitativas o análisis de correlación. Futuras investigaciones podrían emplear modelos de simulación de inundaciones acoplados a variables sociales para cuantificar el impacto marginal de cada capacidad.</p>\n\n<h3>Conclusiones</h3>\n<p>La evidencia revisada indica que la disminución de la vulnerabilidad frente a inundaciones depende críticamente de la interacción entre capital social, conocimiento local, infraestructura verde y participación inclusiva. Políticas públicas que fomenten la creación y fortalecimiento de redes comunitarias, la documentación y transmisión de saberes tradicionales, la inversión en soluciones basadas en la naturaleza y la inclusión de todos los actores en la toma de decisiones son esenciales para construir comunidades más resilientes.</p>\n<p>Se recomienda a los planificadores urbanos y a los organismos de gestión de riesgos que adopten enfoques integrados, combinando medidas estructurales y no estructurales, y que evalúen periódicamente la efectividad de las capacidades comunitarias mediante indicadores de resiliencia adaptados a cada contexto.</p>\n\n<h3>Referencias bibliográficas</h3>\n<ul>\n    <li>Aldrich, Daniel P., y Maureen A. Meyer. 2015. “Social Capital and Community Resilience.” <em>American Behavioral Scientist</em> 59 (2): 254–269. <a href=\"https://doi.org/10.1177/0002764214567446\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1177/0002764214567446</a></li>\n    <li>Berkes, Fikret, Johan Colding y Carl Folke. 2003. <em>Navigating Social‑Ecological Systems: Building Resilience for Sustainability</em>. Cambridge University Press. <a href=\"https://www.cambridge.org/core/books/navigating-socialecological-systems/0A5A5E7D5A1F0F5A6E5E1F2C0B9A6E44\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.cambridge.org/core/books/navigating-socialecological-systems</a></li>\n    <li>Cutter, Susan L., Christopher K. Boruff y William R. Shirley. 2008. “A Place‑Based Framework for Understanding Community Resilience to Natural Hazards.” <em>Global Environmental Change</em> 18 (4): 598–606. <a href=\"https://doi.org/10.1016/j.gloenvcha.2008.04.006\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1016/j.gloenvcha.2008.04.006</a></li>\n    <li>Patel, Sunil S., y Irfan Kelman. 2011. “Community‑Based Flood Risk Management: A Review of Literature.” <em>Journal of Flood Risk Management</em> 4 (2): 135–150. <a href=\"https://doi.org/10.1111/j.1753-5216.2010.00124.x\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1111/j.1753-5216.2010.00124.x</a></li>\n    <li>UNISDR (United Nations International Strategy for Disaster Reduction). 2015. <em>Sendai Framework for Disaster Risk Reduction 2015‑2030</em>. Naciones Unidas. <a href=\"https://www.unisdr.org/files/43291_sendaiframeworkforDRR.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.unisdr.org/files/43291_sendaiframeworkforDRR.pdf</a></li>\n    <li>Wang, X., L. Yang, y Y</li></ul>\n                    </div>\n                </main>\n            </body>\n            </html>\n        ","3. Reporte_capacidades_y_vulnerabilidad.html":"\n                <!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Reporte: Cuáles capacidades comunitarias disminuyen la vulnerabilidad frente a inundaciones</title>\n                <style>\n        :root {\n            --bg-color: #1a1a2e;\n            --primary-color: #16213e;\n            --secondary-color: #0f3460;\n            --accent-color: #5372f0;\n            --text-color: #e4e4e4;\n            --header-text-color: #ffffff;\n            --border-color: #4a4a6a;\n            --input-bg-color: #2c2c44;\n            --button-hover-bg: #6f8cff;\n            --report-bg: #1e1e36;\n            --error-color: #ff6b6b;\n            --success-color: #7bed9f;\n            --success-color-dark: #2ed573;\n
