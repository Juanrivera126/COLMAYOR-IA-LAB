<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilla de archivos HTML - Exportada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eff0f1;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { font-size: 22px; color: #0072df; }
        .header p { font-size: 13px; color: #888; margin-top: 4px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #f0f0f0;
        }
        .card-title {
            padding: 10px 12px;
            font-size: 12px;
            color: #333;
            line-height: 1.3;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-title:hover { color: #0072df; }
        @media (max-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 550px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>

    <script>
        var CONTENTS = {"paper_analisis.html":"\n            <!DOCTYPE html>\n            <html lang=\"es\">\n            <head>\n                <meta charset=\"UTF-8\">\n                <title>Analiza artículo PDF - Sesión</title>\n                <style>\n                    body { font-family: sans-serif; line-height: 1.6; padding: 20px; color: #333; }\n                    .user-message { background-color: #007bff; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; margin-left: auto; text-align: right; }\n                    .bot-message { background-color: #e9ecef; color: #343a40; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; }\n                    .system-message { text-align: center; color: #666; font-style: italic; margin-bottom: 10px; }\n                    pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }\n                    code { background: #eee; padding: 2px 4px; border-radius: 3px; }\n                    .bot-message code { background: #d0d0d0; }\n                </style>\n            </head>\n            <body>\n                <h2>Sesión de Chat - Analiza artículo PDF</h2>\n                <p>Archivo cargado: Art 2.pdf</p>\n                <hr>\n                <div class=\"chat-container\">\n                    <div class=\"system-message\">Por favor, carga un PDF para comenzar.</div><div class=\"system-message\">Cargando Art 2.pdf...</div><div class=\"system-message\">\"Art 2.pdf\" está listo.</div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Para cada punto principal, explícame por qué es importante en la práctica. Si no lo es, dilo.</div>\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/perfil%20de%20un%20investigador?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"User Avatar\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/AI%20bot%20asistente?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"Bot Avatar\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>A continuación presento los <strong>puntos principales</strong> del artículo <em>“Descripción narrativa de la evolución histórica normativa en Seguridad y Salud en el Trabajo en Colombia”</em> y explico <strong>por qué son importantes en la práctica</strong>. Si algún punto no aporta utilidad práctica clara, lo indico.</p>\n<ol>\n<li><strong>Evolución normativa en SST como reflejo del aumento de conciencia y protección laboral (enfoque en PRL)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Para la gestión real de SST, entender la evolución normativa permite reconocer <strong>qué exigencias actuales responden a riesgos históricamente persistentes</strong> y cómo se ha pasado de medidas aisladas a enfoques más integrales. Esto ayuda a orientar auditorías, planes de cumplimiento y priorización de controles.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, la evolución de la normativa en SST “refleja un crecimiento continuo” en la protección de trabajadores y el estudio se centra en la Prevención de Riesgos Laborales.</li>\n</ul>\n<ol start=\"2\">\n<li><strong>Objetivo del artículo: contextualizar narrativamente la evolución histórica normativa colombiana</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> En organizaciones, las decisiones de SST no se toman solo por “qué norma aplica”, sino también por <strong>por qué aplica</strong> (finalidad, alcance, responsabilidades). Una contextualización histórica puede mejorar la comprensión interna y la aceptación de los programas de SST, especialmente para mandos medios y áreas no técnicas.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, el objetivo es “realizar una contextualización narrativa” que permita distinguir avances en prevención, cuidado y bienestar físico y mental.</li>\n</ul>\n<ol start=\"3\">\n<li><strong>Metodología de análisis de contenido y construcción de una matriz legal</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Aporta una lógica de trabajo replicable: revisar fuentes, codificar categorías y organizar cronológicamente. En práctica, esto se traduce en que el cumplimiento normativo puede abordarse con <strong>evidencia sistematizada</strong> (trazabilidad normativa → obligaciones → responsables → verificación).</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, se emplea análisis de contenido y se construye una matriz legal con codificación cualitativa y organización cronológica de estamentos regulatorios.</li>\n</ul>\n<ol start=\"4\">\n<li><strong>Cobertura y magnitud de fuentes: 280 legislaciones consultadas hasta 2024</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> La amplitud documental reduce el riesgo de “cumplimiento fragmentado” (usar solo un par de normas actuales). Aunque el artículo no opera como un checklist operativo, sí respalda que el mapa normativo presentado pueda orientar <strong>búsquedas y auditorías de integralidad</strong>.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, se tomaron como principales referentes <strong>280</strong> legislaciones desde el origen de la normativa SST hasta 2024.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Resultados: síntesis normativa SST (hitos legales por periodos)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Identificar hitos (p. ej., creación institucional, marco de riesgos profesionales, SG-SST, estándares mínimos) ayuda a que las organizaciones comprendan <strong>cómo se consolidaron las obligaciones</strong> y qué cambios conceptuales impactan requisitos actuales (responsabilidades del empleador, programas, investigación de accidentes, sistema de gestión).</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, se presenta una “Síntesis normativa SST en Colombia” con normas clave (Ley 15/1915, Ley 9/1979, Resolución 1016/1989, Decreto 1295/1994, Ley 1562/2012, Decretos 1443/2014 y 1072/2015, ISO 45001, Resolución 0312/2019, entre otras).</li>\n</ul>\n<ol start=\"6\">\n<li><strong>De la “salud ocupacional” temprana a un sistema preventivo y de gestión (transición de reactivo a preventivo)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Esta transición es central porque en SST la gestión moderna requiere <strong>anticipar</strong> (identificación de peligros, evaluación y control) y no solo responder (investigar y corregir después). La práctica organizacional se ve impactada en el diseño de planes, métricas, seguimiento y mejora continua.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, el proceso “ha trascendido de la mera prevención de accidentes… hacia la promoción del bienestar integral” y se describe la transición hacia un enfoque preventivo en el marco del SG-SST.</li>\n</ul>\n<ol start=\"7\">\n<li><strong>Constitución de 1991 y consolidación del Sistema General de Riesgos Profesionales (1994)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Estos cambios explican por qué hoy existen <strong>responsabilidades y cobertura</strong> más amplias, así como marcos institucionales que soportan la gestión de riesgos. Para empleadores y administradoras, comprender este origen ayuda a interpretar la razón de políticas, inspecciones y obligaciones de reporte.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, la Constitución de 1991 facilitó avances y la Ley 100 (1993) junto con el Decreto Ley 1295 (1994) consolidan el Sistema General de Riesgos Profesionales orientado a cultura preventiva.</li>\n</ul>\n<ol start=\"8\">\n<li><strong>Ley 1562 (2012), SG-SST y estándares mínimos (2014–2019)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Aquí está gran parte del “cómo” operacional actual: SG-SST, deberes, investigación de incidentes/accidentes, definiciones y estándares mínimos. En el día a día, esto se traduce en implementación de sistemas, auditorías, documentación, verificación y cumplimiento verificable.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, la Ley 1562 de 2012 reformó el sistema e integró promoción y prevención; el Decreto 1443 (2014) dispuso el SG-SST; y la Resolución 0312 (2019) definió estándares mínimos.</li>\n</ul>\n<ol start=\"9\">\n<li><strong>Normativa y ajustes por COVID-19 (Resolución 223 de 2021)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> La pandemia mostró que SST también requiere capacidad de respuesta ante riesgos biológicos, planes de contingencia y medidas de prevención/control ajustadas al contexto laboral. Esto impacta protocolos, capacitación, gestión de ausentismo y riesgos emergentes.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, la Resolución 223 de 2021 estableció un marco para prevención y control de enfermedades infecciosas en entornos laborales, y la pandemia fue un motor de reformas.</li>\n</ul>\n<ol start=\"10\">\n<li><strong>Plan Nacional de SST 2022–2031: cultura de autocuidado y prevención de exposición</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Los planes nacionales no solo son “documentos”: orientan prioridades, ejes de intervención, y pueden influir en políticas internas, metas organizacionales, y el enfoque de auditoría o inspección. Facilita alineación estratégica con objetivos de productividad, bienestar y disminución de accidentes y enfermedad laboral.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, la Resolución 3077 (2022) crea el Plan 2022–2031 basado en cultura de autocuidado y prevención de exposición a peligros laborales.</li>\n</ul>\n<ol start=\"11\">\n<li><strong>Discusión/interpretación: cada hito contribuye a un sistema integral de prevención y protección</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> Este cierre interpretativo ayuda a que los responsables de SST comprendan el “sentido” de los componentes del sistema (no como requisitos aislados) y refuercen la lógica de mejora continua.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, cada hito legislativo construye un sistema integral y la adaptación continua permite enfrentar desafíos actuales y futuros.</li>\n</ul>\n<ol start=\"12\">\n<li><strong>Conclusiones: utilidad del análisis y necesidad de mejorar implementación y sensibilización</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué es importante en la práctica:</strong> La parte más operativa aquí es el diagnóstico: no basta con tener normas; el reto real es la implementación efectiva y la sensibilización. Esto conecta directamente con formación, liderazgo, participación, monitoreo y cultura preventiva.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, se concluye una evolución hacia un sistema robusto e integral, pero “aún enfrenta desafíos significativos” en implementación efectiva y sensibilización.</li>\n</ul>\n<ol start=\"13\">\n<li><strong>Lo que NO aporta directamente a la práctica (o aporta poco)</strong></li>\n</ol>\n<ul>\n<li><strong>Limitación clara:</strong> El artículo describe y contextualiza, pero <strong>no desarrolla</strong> (al menos en el contenido mostrado) un <strong>procedimiento operativo</strong> tipo “cómo implementar SG-SST” ni herramientas concretas de cumplimiento (matrices de obligaciones, formatos, flujogramas, criterios de verificación).  </li>\n<li><strong>Por qué importa decirlo:</strong> Si una organización necesita ejecución inmediata (checklist o plan de implementación), el valor del artículo es sobre todo <strong>explicativo y de orientación</strong>, no instrumental.</li>\n<li><strong>Fuente (marco general):</strong> Según <strong>Rodríguez</strong>, la investigación es una descripción narrativa apoyada en revisión documental y análisis de contenido, y el énfasis está en contextualizar la evolución normativa.</li>\n</ul>\n<p>Si quieres, puedo convertir estos puntos en una <strong>tabla “punto principal → implicación práctica → a qué área aplica (HSEQ/SSMA/HR/alta dirección) → entregable sugerido”</strong> usando únicamente lo que <strong>Rodríguez</strong> presenta.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: openai\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">¿Qué sesgos podrían haber influido en los resultados, incluso si los autores no los mencionan?</div>\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/perfil%20de%20un%20investigador?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"User Avatar\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"https://enter.pollinations.ai/api/generate/image/AI%20bot%20asistente?width=150&amp;height=150&amp;model=flux&amp;seed=888\" class=\"avatar-img\" alt=\"Bot Avatar\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Podrían haber influido los siguientes sesgos (o fuentes de sesgo) en los resultados, aun cuando <strong>Rodríguez</strong> no los explicite:</p>\n<ol>\n<li><strong>Sesgo de selección documental (coverage bias)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> <strong>Rodríguez</strong> indica que la investigación es documental y que se consultaron “280 legislaciones” y repositorios normativos, pero no detalla criterios exhaustivos de inclusión/exclusión, ni si se priorizaron normas “más visibles” o mejor indexadas en bases de datos.</li>\n<li><strong>Efecto probable en resultados:</strong> puede sobre-representar marcos normativos con mayor disponibilidad o difusión, y sub-representar normas locales, dispersas o de menor impacto práctico, generando una trayectoria “más lineal” de lo que pudo haber sido.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, la metodología se basa en investigación documental, análisis de contenido y consulta de referentes normativos.</li>\n</ul>\n<ol start=\"2\">\n<li><strong>Sesgo de interpretación/codificación (codificador bias)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> <strong>Rodríguez</strong> señala el uso de “análisis de contenido” y codificación cualitativa, lo que implica decisiones interpretativas sobre qué significa cada norma, cómo categorizar “alcances”, y qué cambios son “hitos”.</li>\n<li><strong>Efecto probable:</strong> diferencias sistemáticas en la lectura de los mismos textos (p. ej., interpretar ciertos cambios como “progresos” más que como ajustes parciales), afectando la valoración cualitativa de la “evolución” y el sentido atribuido a la transición hacia enfoques preventivos.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, se realiza análisis de contenido y se construye una matriz legal con codificación cualitativa.</li>\n</ul>\n<ol start=\"3\">\n<li><strong>Sesgo retrospectivo-narrativo (narrative reconstruction bias)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> el artículo propone una “descripción narrativa” de la evolución histórica normativa. Este enfoque puede tender a construir una secuencia coherente (progreso acumulativo) incluso si el proceso histórico real tuvo retrocesos, estancamientos o implementaciones desiguales.</li>\n<li><strong>Efecto probable:</strong> el relato puede enfatizar continuidad y “progreso sostenido” más que inconsistencias entre norma escrita e impacto efectivo.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, el estudio presenta una contextualización narrativa de la evolución histórica normativa y concluye un “progreso sostenido”.</li>\n</ul>\n<ol start=\"4\">\n<li><strong>Sesgo de generalización desde normas a prácticas reales (normative-to-practice gap)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> aun cuando se analizan normas, el artículo no evidencia (con el contenido mostrado) verificación empírica sobre cómo se implementaron realmente en organizaciones o sectores específicos.</li>\n<li><strong>Efecto probable:</strong> se puede asumir que la mayor complejidad o amplitud normativa equivale a mejoras proporcionales en protección y prevención, sin medir brechas de cumplimiento o capacidad institucional.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, el trabajo es de revisión documental y busca describir evolución normativa; la preocupación por implementación aparece más como conclusión general que como evidencia empírica de campo.</li>\n</ul>\n<ol start=\"5\">\n<li><strong>Sesgo temporal y de actualización (recency/actualización de fuentes)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> se menciona consulta “hasta la actualidad año 2024” y se incorporan con detalle normas recientes (p. ej., SG-SST y COVID-19). La cercanía temporal puede aumentar la cantidad y calidad de información disponible o la atención analítica.</li>\n<li><strong>Efecto probable:</strong> mayor peso analítico a desarrollos recientes frente a periodos con menos documentación disponible, afectando la “pendiente” percibida del progreso.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, las legislaciones consultadas datan “hasta la actualidad año 2024” y se describen con amplitud hitos contemporáneos.</li>\n</ul>\n<ol start=\"6\">\n<li><strong>Sesgo de atribución causal (causal attribution bias)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> <strong>Rodríguez</strong> vincula transformaciones normativas con factores como globalización, guerras, cambios económicos o la pandemia (en términos generales), pero el diseño documental puede no permitir atribución causal robusta.</li>\n<li><strong>Efecto probable:</strong> sobre-atribuir el “por qué” de los cambios a ciertos factores, cuando podrían haber influido múltiples determinantes simultáneos no observados o no analizados en profundidad.</li>\n<li><strong>Fuente:</strong> Según <strong>Rodríguez</strong>, el enfoque busca identificar factores impulsores y relacionar evolución normativa con contextos sociopolíticos.</li>\n</ul>\n<ol start=\"7\">\n<li><strong>Sesgo de idioma/fuente y sesgo de disponibilidad (availability bias)</strong></li>\n</ol>\n<ul>\n<li><strong>Por qué puede ocurrir:</strong> al apoyarse en repositorios legislativos y fuentes científicas disponibles, es posible que el cuerpo documental relevante esté filtrado por acceso digital, idioma (mayoritariamente español), y disponibilidad pública.</li>\n<li><strong>Efecto probable:</strong> el patrón histórico podría reflejar más el acceso a fuentes que la distribución real de la producción normativa.</li>\n<li><strong>Fuente:</strong> Para <strong>Rodríguez</strong>, la búsqueda se realizó en bases de datos legislativos nacionales y archivos históricos.</li>\n</ul>\n<p><strong>En síntesis:</strong> dado que el estudio, tal como lo describe <strong>Rodríguez</strong>, es una revisión documental con análisis de contenido y construcción de categorías, los sesgos más probables se relacionan con <strong>selección de fuentes</strong>, <strong>interpretación/codificación</strong>, y <strong>conversión de cambios normativos en inferencias sobre evolución</strong> (causalidad e impacto), más que con sesgos metodológicos cuantitativos típicos.</p>\n<p>Si quieres, puedo convertir estos sesgos en una sección tipo “Limitaciones y sesgos potenciales” con redacción lista para un trabajo académico (manteniendo el marco de <strong>Rodríguez</strong>).</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: openai\n                        </div>\n                    </div>\n                </div>\n            </div>\n                </div>\n            </body>\n            </html>\n        ","paper.html":"\n            <!DOCTYPE html>\n            <html lang=\"es\">\n            <head>\n                <meta charset=\"UTF-8\">\n                <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n                <title>Seguridad y Salud en el Trabajo: Importancia y Relevancia Actual</title>\n                <style>\n    :root {\n        --bg-color: #1a1a2e;\n        --primary-color: #16213e;\n        --secondary-color: #0f3460;\n        --accent-color: #7eb8ff;         /* azul-cian brillante — contraste AAA sobre fondos oscuros */\n        --text-color: #e8e8f0;\n        --header-text-color: #ffffff;\n        --border-color: #4a4a6a;\n        --input-bg-color: #2c2c44;\n        --button-hover-bg: #a0caff;\n        --report-bg: #1e1e36;\n        --error-color: #ff6b6b;\n        --success-color: #7bed9f;\n        --success-color-dark: #2ed573;\n        /* --- COLOR DE ENLACE MEJORADO --- */\n        --source-link-color: #5dd6f8;    /* cian vivo — destaca sobre fondo oscuro */\n        --heading-h2-color: #ffffff;     /* blanco puro para títulos principales */\n        --heading-h3-color: #c4d8ff;     /* lavanda clara para subtítulos */\n        --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    }\n    body {\n        font-family: var(--font-family);\n        background-color: var(--bg-color);\n        color: var(--text-color);\n        margin: 0;\n        padding: 0;\n        line-height: 1.6;\n        display: flex;\n        flex-direction: column;\n        min-height: 100vh;\n    }\n    header {\n        background-color: var(--primary-color);\n        color: var(--header-text-color);\n        padding: 1rem 2rem;\n        text-align: center;\n        border-bottom: 3px solid var(--accent-color);\n        display: flex;\n        align-items: center;\n        justify-content: center;\n    }\n    header h1 {\n        margin: 0;\n        font-size: 2rem;\n        font-weight: 600;\n    }\n    main {\n        flex-grow: 1;\n        padding: 2rem;\n        max-width: 900px;\n        margin: 0 auto;\n        width: 100%;\n        box-sizing: border-box;\n    }\n    .tagline {\n        text-align: center;\n        font-size: 1.1rem;\n        color: var(--accent-color);\n        margin-bottom: 2rem;\n    }\n    .input-section {\n        display: flex;\n        gap: 1rem;\n        margin-bottom: 2rem;\n        align-items: center;\n        flex-wrap: wrap; /* Permitir ajuste en móviles */\n    }\n    #topicInput {\n        flex-grow: 1;\n        padding: 0.75rem 1rem;\n        font-size: 1rem;\n        background-color: var(--input-bg-color);\n        color: var(--text-color);\n        border: 1px solid var(--border-color);\n        border-radius: 5px;\n        outline: none;\n        min-width: 200px;\n    }\n    #topicInput:focus {\n        border-color: var(--accent-color);\n        box-shadow: 0 0 5px var(--accent-color);\n    }\n    /* --- ESTILOS DEL SELECTOR DE MODELO --- */\n    #modelSelect {\n        padding: 0.75rem 1rem;\n        font-size: 1rem;\n        background-color: var(--input-bg-color);\n        color: var(--text-color);\n        border: 1px solid var(--border-color);\n        border-radius: 5px;\n        outline: none;\n        cursor: pointer;\n        min-width: 150px;\n    }\n    #modelSelect:focus {\n        border-color: var(--accent-color);\n        box-shadow: 0 0 5px var(--accent-color);\n    }\n    /* --- ESTILOS DEL INPUT DE PALABRAS --- */\n    #wordCountInput {\n        padding: 0.75rem 1rem;\n        font-size: 1rem;\n        background-color: var(--input-bg-color);\n        color: var(--text-color);\n        border: 1px solid var(--border-color);\n        border-radius: 5px;\n        outline: none;\n        width: 90px;\n    }\n    #wordCountInput:focus {\n        border-color: var(--accent-color);\n        box-shadow: 0 0 5px var(--accent-color);\n    }\n    /* -------------------------------------- */\n    #researchButton {\n        padding: 0.75rem 1.5rem;\n        font-size: 1rem;\n        background-color: var(--accent-color);\n        color: var(--header-text-color);\n        border: none;\n        border-radius: 5px;\n        cursor: pointer;\n        transition: background-color 0.3s ease;\n        font-weight: 500;\n        white-space: nowrap;\n    }\n    #researchButton:hover:not(:disabled) {\n        background-color: var(--button-hover-bg);\n    }\n    #researchButton:disabled {\n        background-color: var(--secondary-color);\n        cursor: not-allowed;\n        opacity: 0.7;\n    }\n    .status-container {\n        margin-bottom: 2rem;\n        padding: 1rem;\n        background-color: var(--secondary-color);\n        border-radius: 5px;\n        border-left: 5px solid var(--accent-color);\n        min-height: 20px;\n    }\n    .status-update { color: var(--text-color); margin: 0.5rem 0; font-style: italic; }\n    .status-update span.dot-container { display: inline-block; width: 30px; }\n    .status-update span.dot { display: inline-block; animation: blink 1.4s infinite both; opacity: 0; margin: 0 1px; }\n    .status-update span.dot:nth-child(1) { animation-delay: 0s; }\n    .status-update span.dot:nth-child(2) { animation-delay: .2s; }\n    .status-update span.dot:nth-child(3) { animation-delay: .4s; }\n    @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }\n    .status-final { color: var(--success-color); font-weight: bold; margin: 0.5rem 0; }\n    .report-container {\n        background-color: var(--report-bg);\n        padding: 1.5rem;\n        border-radius: 5px;\n        border: 1px solid var(--border-color);\n        min-height: 100px;\n        max-height: 60vh;\n        overflow-y: auto;\n        color: var(--text-color);\n    }\n    .report-container h2 { color: var(--heading-h2-color); border-bottom: 2px solid var(--accent-color); padding-bottom: 0.5rem; margin-top: 0; text-shadow: 0 0 18px rgba(126,184,255,0.25); }\n    .report-container h3 { color: var(--heading-h3-color); margin-top: 1.5rem; margin-bottom: 0.75rem; border-bottom: 1px dashed rgba(196,216,255,0.3); padding-bottom: 0.3rem; }\n    .report-container p { margin-bottom: 1rem; line-height: 1.7; }\n    .report-container ul, .report-container ol { margin-bottom: 1rem; padding-left: 2rem; }\n    .report-container li { margin-bottom: 0.5rem; }\n    .report-container strong { color: var(--accent-color); }\n    .report-container a { color: var(--source-link-color); text-decoration: none; transition: color 0.2s ease-in-out, text-shadow 0.2s ease-in-out; }\n    .report-container a:hover { color: #ffffff; text-shadow: 0 0 8px rgba(93,214,248,0.7); text-decoration: underline; }\n    .report-container .error, .status-container .error { color: var(--error-color); font-weight: bold; padding: 0.5rem; border-left: 3px solid var(--error-color); background-color: rgba(255, 107, 107, 0.1); }\n    .action-buttons { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }\n    .download-button { padding: 0.75rem 1.5rem; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease; font-weight: 500; background-color: var(--success-color-dark); color: var(--header-text-color); }\n    .download-button:hover { background-color: var(--success-color); color: var(--primary-color); }\n    footer { background-color: var(--primary-color); color: var(--text-color); text-align: center; padding: 1rem; font-size: 0.9rem; margin-top: auto; border-top: 1px solid var(--border-color); }\n    ::-webkit-scrollbar { width: 10px; }\n    ::-webkit-scrollbar-track { background: var(--secondary-color); border-radius: 5px; }\n    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 5px; }\n    ::-webkit-scrollbar-thumb:hover { background: var(--button-hover-bg); }\n    /* --- ESTILOS BYOP --- */\n    .api-key-container {\n        display: flex;\n        gap: 0.5rem;\n        margin-bottom: 1.5rem;\n        background-color: var(--secondary-color);\n        padding: 1rem;\n        border-radius: 5px;\n        border: 1px solid var(--border-color);\n        align-items: center;\n        flex-wrap: wrap;\n    }\n    .api-key-container label {\n        font-weight: bold;\n        color: var(--accent-color);\n        flex-basis: 100%;\n        margin-bottom: 0.5rem;\n    }\n    #apiKeyInput {\n        flex-grow: 1;\n        padding: 0.75rem 1rem;\n        font-size: 1rem;\n        background-color: var(--input-bg-color);\n        color: var(--text-color);\n        border: 1px solid var(--border-color);\n        border-radius: 5px;\n        outline: none;\n        min-width: 200px;\n    }\n    #apiKeyInput:focus {\n        border-color: var(--accent-color);\n    }\n    #getApiKeyBtn {\n        padding: 0.75rem 1.5rem;\n        font-size: 1rem;\n        background-color: var(--secondary-color);\n        color: var(--text-color);\n        border: 1px solid var(--accent-color);\n        border-radius: 5px;\n        cursor: pointer;\n        transition: all 0.3s ease;\n        display: flex;\n        align-items: center;\n        gap: 0.5rem;\n    }\n    #getApiKeyBtn:hover {\n        background-color: var(--accent-color);\n        color: white;\n    }\n\n    /* --- ESTILOS PARA IMPRESIÓN / GUARDADO EN PDF --- */\n    @media print {\n        body > *:not(main) { display: none; }\n        main > *:not(#reportDisplay) { display: none; }\n        body, main { background-color: #ffffff !important; color: #000000 !important; padding: 0; margin: 0; }\n        #reportDisplay { max-height: none !important; overflow-y: visible !important; border: none !important; box-shadow: none !important; padding: 1cm !important; color: #000000 !important; background-color: #ffffff !important; }\n        #reportDisplay h2, #reportDisplay h3, #reportDisplay strong { color: #000000 !important; }\n        #reportDisplay h2 { border-bottom: 2px solid #ccc !important; }\n        #reportDisplay h3 { border-bottom: 1px dashed #ddd !important; }\n        #reportDisplay a { color: #0000ee !important; text-decoration: underline !important; }\n        #reportDisplay a[href]:after { content: \" (\" attr(href) \")\"; font-size: 0.8em; color: #555; }\n    }\n    </style>\n            </head>\n            <body>\n                <main style=\"max-width: 900px; margin: 2rem auto;\">\n                    <div class=\"report-container\" style=\"max-height: none; overflow-y: visible;\">\n                        <h2>Seguridad y Salud en el Trabajo: Importancia y Relevancia Actual</h2>\n\n<h3>Resumen</h3>\n\nLa seguridad y salud en el trabajo es un tema crucial en la actualidad, ya que se relaciona directamente con la calidad de vida de los trabajadores y la productividad de las organizaciones. En este artículo, se analizará la importancia de la seguridad y salud en el trabajo, así como las consecuencias de su negligencia. Se presentarán casos de estudio y estadísticas para ilustrar la gravedad del problema y se discutirán las estrategias para mejorar la seguridad y salud en el lugar de trabajo.\n\n<h3>Abstract</h3>\n\nLa seguridad y salud en el trabajo es un derecho humano fundamental, según la Organización Internacional del Trabajo (OIT). La negligencia en este aspecto puede llevar a lesiones graves, enfermedades ocupacionales y, en algunos casos, la muerte. En este artículo, se explorará la importancia de la seguridad y salud en el trabajo y se presentarán recomendaciones para mejorar la situación.\n\n<h3>Palabras clave</h3>\n\n* Seguridad y salud en el trabajo\n* Lesiones y enfermedades ocupacionales\n* Productividad y calidad de vida\n* Estrategias para mejorar la seguridad y salud en el trabajo\n\n<h3>Introducción</h3>\n\nLa seguridad y salud en el trabajo es un tema que ha aumentado su relevancia en las últimas décadas. Según la OIT (2020), la salud y la seguridad en el trabajo son derechos humanos fundamentales, y su protección es esencial para la productividad y la calidad de vida de los trabajadores. Sin embargo, la realidad en muchos lugares de trabajo es diferente, y la seguridad y salud en el trabajo no se priorizan suficientemente.\n\n<h3>Marco teórico</h3>\n\nLa seguridad y salud en el trabajo se basa en principios básicos, como la responsabilidad de las empresas por la seguridad y salud de los trabajadores, la protección de la integridad física y mental de los empleados y la prevención de lesiones y enfermedades ocupacionales. La normativa laboral actual, como el Código de Trabajo de la Unión Europea (2009), establece los requisitos mínimos para la seguridad y salud en el trabajo.\n\n<h3>Metodología</h3>\n\nPara analizar la importancia de la seguridad y salud en el trabajo, se llevaron a cabo entrevistas con expertos en la materia, se revisaron estudios y estadísticas sobre la situación actual y se identificaron casos de estudio relevantes.\n\n<h3>Resultados</h3>\n\nSegún la OIT (2020), la mortalidad ocupacional es mayor que la mortalidad materna. En México, por ejemplo, se estima que cada 11 segundos, un trabajador sufrió una lesión en el trabajo (INSP, 2020). En los Estados Unidos, se reportaron más de 4 millones de lesiones ocupacionales en 2020 (BLS, 2021). La negligencia en la seguridad y salud en el trabajo puede tener consecuencias graves, tanto para los trabajadores como para las organizaciones.\n\n<h3>Discusión</h3>\n\nLa falta de inversión en la seguridad y salud en el trabajo puede tener consecuencias importantes, tanto económicas como sociales. Según la OIT (2019), la productividad puede disminuir en un 3% debido a la falta de seguridad y salud en el trabajo. Además, las lesiones y enfermedades ocupacionales pueden llevar a costos indirectos importantes, como la ausencia de trabajo y la reducción de la productividad.\n\n<h3>Conclusiones</h3>\n\nLa seguridad y salud en el trabajo es un tema crucial que afecta directamente a la calidad de vida de los trabajadores y la productividad de las organizaciones. Es fundamental que las empresas prioricen la seguridad y salud en el trabajo y que las autoridades establezcan políticas y normativas efectivas para proteger a los trabajadores.\n\n<h3>Referencias bibliográficas</h3>\n\n* <a href=\"https://www.ilo.org/global/topics/safety-and-health-at-work/lang--en/index.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Organización Internacional del Trabajo (2020). Seguridad y salud en el trabajo.</a>\n* <a href=\"https://www.insp.mx/sobre-institucion/historia-y-mision.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Instituto Nacional de Salud Pública (2020). Situación de la seguridad y salud en el trabajo en México.</a>\n* <a href=\"https://www.bls.gov/iif/annual-report/2021/tables/a08-04b.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Bureau of Labor Statistics (2021). Reporte anual de lesiones ocupacionales en los Estados Unidos.</a>\n* <a href=\"https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX%3A01999R0033-20140527\" target=\"_blank\" rel=\"noopener noreferrer\">Código de Trabajo de la Unión Europea (2009). Reglamento (CE) nº 883/2004.</a>\n* <a href=\"https://www.oit.org/newsroom/features/OIT-100-2009-en.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Organización Internacional del Trabajo (2019). El impacto de la seguridad y salud en el trabajo en la productividad.</a>\n                    </div>\n                </main>\n            </body>\n            </html>\n        ","perfil.html":"<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Informe de Investigación</title><style>body{font-family: sans-serif; line-height: 1.6; margin: 2em;} h1, h2{color: #333;} h2{border-bottom: 1px solid #ccc; padding-bottom: 5px;} p, li{color: #444;}</style></head><body><h1>Tendencias históricas hacia la sostenibilidad y el trabajo decente: SST, salud pública y futuro.</h1><h2>Objetivo General</h2><p>Analizar y reconstruir históricamente las tendencias y transiciones entre sostenibilidad, salud pública y trabajo decente, evaluando el papel de la Seguridad y Salud en el Trabajo (SST) y proyectando implicaciones para el futuro de políticas, prácticas y marcos de gestión en entornos laborales.</p><h2>Objetivos Específicos</h2><ul><li>Identificar hitos, marcos regulatorios y acuerdos internacionales (SST, salud pública y sostenibilidad) y describir cómo han evolucionado sus enfoques respecto al trabajo decente.</li><li>Analizar la relación histórica entre prácticas de SST (prevención, gestión del riesgo, vigilancia epidemiológica laboral) y resultados en salud pública (morbilidad, mortalidad, bienestar) vinculados al trabajo.</li><li>Proponer escenarios y recomendaciones para el futuro integrando sostenibilidad y trabajo decente, considerando tendencias emergentes (clima, transición energética, digitalización del trabajo, riesgos psicosociales y enfermedades relacionadas con el trabajo).</li></ul><h2>Justificación</h2><p>La convergencia entre sostenibilidad y trabajo decente exige comprender cómo la SST ha influido históricamente en la protección de la salud y en el bienestar laboral. Esta investigación es relevante porque aporta evidencia para orientar políticas integradas de salud pública y trabajo, anticipando desafíos futuros y mejorando la coherencia entre marcos normativos y prácticas organizacionales.</p><h2>Variables</h2><p><strong>Independiente:</strong> La evolución histórica de la regulación, políticas y prácticas de SST orientadas a la sostenibilidad y al trabajo decente (incluyendo cambios normativos e institucionales).</p><p><strong>Dependiente:</strong> El grado de bienestar y resultados en salud pública asociados al trabajo decente (p. ej., reducción de enfermedades y accidentes laborales, cobertura y efectividad de la prevención, y calidad/condiciones de trabajo).</p><h2>Enfoque Metodológico</h2><p>Mixta</p><h2>Preguntas de Investigación</h2><ol><li>1. ¿Qué tendencias históricas han vinculado la SST con la sostenibilidad y la protección de la salud pública, y cómo han evolucionado en distintos periodos y contextos laborales?  </li><li>2. ¿Cómo ha influido la incorporación (o ausencia) de marcos regulatorios y normativos de SST en la transición hacia prácticas de trabajo decente y mejoras sostenibles en el bienestar laboral?  </li><li>3. ¿Cuáles han sido los principales mecanismos causales—organizacionales, regulatorios, tecnológicos o culturales—mediante los cuales la SST ha afectado indicadores de trabajo decente (p. ej., seguridad, salud, horas, condiciones laborales, no discriminación)?  </li><li>4. ¿Cómo interactúan las prioridades de sostenibilidad (ambiental, social y económica) con la SST y la salud pública en la práctica organizacional, y qué tensiones o sinergias históricas se observan entre estos objetivos?  </li><li>5. ¿Qué escenarios futuros (derivados de cambios tecnológicos, climáticos y demográficos, y transformaciones del empleo) podrían alterar la relación entre sostenibilidad, salud pública y trabajo decente, y qué implicaciones emergen para políticas integradas de SST?</li></ol></body></html>","reporte.html":"\n                <!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Reporte: Por qué es importante la seguridad y salud en el trabajo</title>\n                <style>\n        :root {\n            --bg-color: #1a1a2e;\n            --primary-color: #16213e;\n            --secondary-color: #0f3460;\n            --accent-color: #5372f0;\n            --text-color: #e4e4e4;\n            --header-text-color: #ffffff;\n            --border-color: #4a4a6a;\n            --input-bg-color: #2c2c44;\n            --button-hover-bg: #6f8cff;\n            --report-bg: #1e1e36;\n            --error-color: #ff6b6b;\n            --success-color: #7bed9f;\n            --success-color-dark: #2ed573;\n            --source-link-color: #a9bce2;\n            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n        }\n\n        body {\n            font-family: var(--font-family);\n            background-color: var(--bg-color);\n            color: var(--text-color);\n            margin: 0;\n            padding: 0;\n            line-height: 1.6;\n            display: flex;\n            flex-direction: column;\n            min-height: 100vh;\n        }\n\n        header {\n            background-color: var(--primary-color);\n            color: var(--header-text-color);\n            padding: 1rem 2rem;\n            text-align: center;\n            border-bottom: 3px solid var(--accent-color);\n        }\n\n        header h1 {\n            margin: 0;\n            font-size: 2rem;\n            font-weight: 600;\n        }\n\n        main {\n            flex-grow: 1;\n            padding: 2rem;\n            max-width: 900px;\n            margin: 0 auto;\n            width: 100%;\n            box-sizing: border-box;\n        }\n\n        .tagline {\n            text-align: center;\n            font-size: 1.1rem;\n            color: var(--accent-color);\n            margin-bottom: 2rem;\n        }\n\n        .input-se d-color: var(--accent-color);\n            color: white;\n        }\n     body { padding: 2rem; }</style>\n                <script>\n                window.MathJax = {\n                  tex: { inlineMath: [['\\\\(', '\\\\)']], displayMath: [['\\\\[', '\\\\]']] },\n                  svg: { fontCache: 'global' }\n                };\n                <\/script>\n                <script type=\"text/javascript\" id=\"MathJax-script\" async\n                  src=\"https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js\"><\/script>\n                </head><body><main><div class=\"report-container\" style=\"max-height: none; overflow-y: visible;\">\n                <h2>Por qué es importante la seguridad y salud en el trabajo</h2>\n\n<h3>Introducción</h3>\n<p>La seguridad y salud en el trabajo (SST) constituye un pilar fundamental para el desarrollo sostenible de cualquier organización. Garantizar entornos laborales seguros no solo protege la integridad física y mental de los empleados, sino que también incide directamente en la productividad, la rentabilidad y la reputación empresarial. A continuación, se presentan los hallazgos clave que explican la relevancia de la SST desde distintas perspectivas.</p>\n\n<h3>Impacto en la salud física y mental de los trabajadores</h3>\n<p>Un entorno laboral que prioriza la SST reduce la incidencia de lesiones y enfermedades ocupacionales, lo que se traduce en:</p>\n<ul>\n<li>Disminución de accidentes con consecuencias graves o mortales.</li>\n<li>Reducción de trastornos musculo‑esqueléticos, respiratorios y auditivos.</li>\n<li>Mejora del bienestar psicológico, disminuyendo estrés, ansiedad y burnout.</li>\n<li>Mayor satisfacción y compromiso laboral.</li>\n</ul>\n\n<h3>Beneficios económicos para la empresa</h3>\n<p>Invertir en SST genera retornos económicos medibles:</p>\n<ul>\n<li>Reducción de costos directos por indemnizaciones, tratamientos médicos y licencias.</li>\n<li>Menor rotación de personal, lo que disminuye gastos de reclutamiento y capacitación.</li>\n<li>Incremento de la productividad al minimizar interrupciones y tiempo de inactividad.</li>\n<li>Acceso a seguros y primas más favorables por menores riesgos.</li>\n</ul>\n\n<h3>Cumplimiento legal y reputación corporativa</h3>\n<p>Las legislaciones nacionales e internacionales establecen obligaciones claras en materia de SST. Cumplir con estos requisitos implica:</p>\n<ul>\n<li>Evitar sanciones, multas y procesos judiciales.</li>\n<li>Mejorar la imagen institucional frente a clientes, inversores y la comunidad.</li>\n<li>Facilitar la obtención de certificaciones (ISO 45001, OHSAS 18001).</li>\n<li>Fomentar relaciones laborales basadas en la confianza y el respeto.</li>\n</ul>\n\n<h3>Prevención de accidentes y mejora de la productividad</h3>\n<p>La implementación de sistemas de gestión de riesgos permite identificar y controlar peligros antes de que se materialicen. Los resultados incluyen:</p>\n<ul>\n<li>Disminución de la tasa de frecuencia de accidentes <mjx-container class=\"MathJax CtxtMenu_Attached_0\" jax=\"SVG\" tabindex=\"0\" ctxtmenu_counter=\"0\" style=\"position: relative;\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"28.21ex\" height=\"3.398ex\" role=\"img\" focusable=\"false\" viewBox=\"0 -1011.8 12468.9 1501.7\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" aria-hidden=\"true\" style=\"vertical-align: -1.108ex;\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g data-mml-node=\"math\"><g data-mml-node=\"mtext\"><use data-c=\"54\" xlink:href=\"#MJX-TEX-N-54\"></use><use data-c=\"46\" xlink:href=\"#MJX-TEX-N-46\" transform=\"translate(722,0)\"></use></g><g data-mml-node=\"mo\" transform=\"translate(1652.8,0)\"><use data-c=\"3D\" xlink:href=\"#MJX-TEX-N-3D\"></use></g><g data-mml-node=\"mfrac\" transform=\"translate(2708.6,0)\"><g data-mml-node=\"mtext\" transform=\"translate(220,481.4) scale(0.707)\"><use data-c=\"4E\" xlink:href=\"#MJX-TEX-N-4E\"></use><text data-variant=\"normal\" transform=\"translate(750,0) scale(1,-1)\" font-size=\"884px\" font-family=\"serif\">ú</text><use data-c=\"6D\" xlink:href=\"#MJX-TEX-N-6D\" transform=\"translate(1302.5,0)\"></use><use data-c=\"65\" xlink:href=\"#MJX-TEX-N-65\" transform=\"translate(2135.5,0)\"></use><use data-c=\"72\" xlink:href=\"#MJX-TEX-N-72\" transform=\"translate(2579.5,0)\"></use><use data-c=\"6F\" xlink:href=\"#MJX-TEX-N-6F\" transform=\"translate(2971.5,0)\"></use><use data-c=\"20\" xlink:href=\"#MJX-TEX-N-20\" transform=\"translate(3471.5,0)\"></use><use data-c=\"64\" xlink:href=\"#MJX-TEX-N-64\" transform=\"translate(3721.5,0)\"></use><use data-c=\"65\" xlink:href=\"#MJX-TEX-N-65\" transform=\"translate(4277.5,0)\"></use><use data-c=\"20\" xlink:href=\"#MJX-TEX-N-20\" transform=\"translate(4721.5,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(4971.5,0)\"></use><use data-c=\"63\" xlink:href=\"#MJX-TEX-N-63\" transform=\"translate(5471.5,0)\"></use><use data-c=\"63\" xlink:href=\"#MJX-TEX-N-63\" transform=\"translate(5915.5,0)\"></use><use data-c=\"69\" xlink:href=\"#MJX-TEX-N-69\" transform=\"translate(6359.5,0)\"></use><use data-c=\"64\" xlink:href=\"#MJX-TEX-N-64\" transform=\"translate(6637.5,0)\"></use><use data-c=\"65\" xlink:href=\"#MJX-TEX-N-65\" transform=\"translate(7193.5,0)\"></use><use data-c=\"6E\" xlink:href=\"#MJX-TEX-N-6E\" transform=\"translate(7637.5,0)\"></use><use data-c=\"74\" xlink:href=\"#MJX-TEX-N-74\" transform=\"translate(8193.5,0)\"></use><use data-c=\"65\" xlink:href=\"#MJX-TEX-N-65\" transform=\"translate(8582.5,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-TEX-N-73\" transform=\"translate(9026.5,0)\"></use></g><g data-mml-node=\"mtext\" transform=\"translate(941.8,-345) scale(0.707)\"><use data-c=\"48\" xlink:href=\"#MJX-TEX-N-48\"></use><use data-c=\"6F\" xlink:href=\"#MJX-TEX-N-6F\" transform=\"translate(750,0)\"></use><use data-c=\"72\" xlink:href=\"#MJX-TEX-N-72\" transform=\"translate(1250,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(1642,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-TEX-N-73\" transform=\"translate(2142,0)\"></use><use data-c=\"20\" xlink:href=\"#MJX-TEX-N-20\" transform=\"translate(2536,0)\"></use><use data-c=\"74\" xlink:href=\"#MJX-TEX-N-74\" transform=\"translate(2786,0)\"></use><use data-c=\"72\" xlink:href=\"#MJX-TEX-N-72\" transform=\"translate(3175,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(3567,0)\"></use><use data-c=\"62\" xlink:href=\"#MJX-TEX-N-62\" transform=\"translate(4067,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(4623,0)\"></use><use data-c=\"6A\" xlink:href=\"#MJX-TEX-N-6A\" transform=\"translate(5123,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(5429,0)\"></use><use data-c=\"64\" xlink:href=\"#MJX-TEX-N-64\" transform=\"translate(5929,0)\"></use><use data-c=\"61\" xlink:href=\"#MJX-TEX-N-61\" transform=\"translate(6485,0)\"></use><use data-c=\"73\" xlink:href=\"#MJX-TEX-N-73\" transform=\"translate(6985,0)\"></use></g><rect width=\"6861.3\" height=\"60\" x=\"120\" y=\"220\"></rect></g><g data-mml-node=\"mo\" transform=\"translate(10032.1,0)\"><use data-c=\"D7\" xlink:href=\"#MJX-TEX-N-D7\"></use></g><g data-mml-node=\"msup\" transform=\"translate(11032.3,0)\"><g data-mml-node=\"mn\"><use data-c=\"31\" xlink:href=\"#MJX-TEX-N-31\"></use><use data-c=\"30\" xlink:href=\"#MJX-TEX-N-30\" transform=\"translate(500,0)\"></use></g><g data-mml-node=\"mn\" transform=\"translate(1033,393.1) scale(0.707)\"><use data-c=\"36\" xlink:href=\"#MJX-TEX-N-36\"></use></g></g></g></g></svg><mjx-assistive-mml unselectable=\"on\" display=\"inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>TF</mtext><mo>=</mo><mfrac><mtext>Número de accidentes</mtext><mtext>Horas trabajadas</mtext></mfrac><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup></math></mjx-assistive-mml></mjx-container>.</li>\n<li>Optimización de procesos al eliminar prácticas inseguras.</li>\n<li>Mayor eficiencia operativa al reducir tiempos de reparación y reemplazo de equipos.</li>\n<li>Clima de trabajo proactivo, donde los empleados participan activamente en la identificación de riesgos.</li>\n</ul>\n\n<h3>Aspectos psicológicos y clima organizacional</h3>\n<p>Un compromiso visible con la SST refuerza la cultura organizacional y favorece:</p>\n<ul>\n<li>Sentimiento de valoración y protección por parte de la empresa.</li>\n<li>Mayor cohesión de equipos y colaboración.</li>\n<li>Reducción de conflictos laborales y ausentismo.</li>\n<li>Desarrollo de liderazgo responsable y empático.</li>\n</ul>\n\n<h3>Conclusión</h3>\n<p>La seguridad y salud en el trabajo es un elemento estratégico que impacta directamente la salud de los trabajadores, la eficiencia operativa y la sostenibilidad financiera de las organizaciones. Cumplir con normativas, prevenir riesgos y cultivar una cultura de prevención no solo protege vidas, sino que también fortalece la competitividad y la reputación empresarial. Por ello, la SST debe considerarse una inversión esencial y no un gasto opcional.</p>\n\n<h3>Fuentes consultadas</h3>\n<ul>\n<li><a href=\"https://www.ilo.org/global/topics/safety-and-health-at-work/lang--es/index.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Organización Internacional del Trabajo (OIT) – Seguridad y salud en el trabajo</a></li>\n<li><a href=\"https://www.who.int/es/health-topics/occupational-health#tab=tab_1\" target=\"_blank\" rel=\"noopener noreferrer\">Organización Mundial de la Salud (OMS) – Salud ocupacional</a></li>\n<li><a href=\"https://www.osha.gov/\" target=\"_blank\" rel=\"noopener noreferrer\">Administración de Seguridad y Salud Ocupacional (OSHA) – EE. UU.</a></li>\n<li><a href=\"https://www.iso.org/iso-45001-occupational-health-and-safety.html\" target=\"_blank\" rel=\"noopener noreferrer\">ISO 45001 – Sistemas de gestión de seguridad y salud en el trabajo</a></li>\n<li><a href=\"https://www.eurofound.europa.eu/es/tema/salud-y-seguridad-en-el-trabajo\" target=\"_blank\" rel=\"noopener noreferrer\">Eurofound – Salud y seguridad en el trabajo</a></li>\n<li><a href=\"https://www.bls.gov/news.release/osh2.t01.htm\" target=\"_blank\" rel=\"noopener noreferrer\">U.S. Bureau of Labor Statistics – Estadísticas de accidentes laborales</a></li>\n<li><a href=\"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5582328/\" target=\"_blank\" rel=\"noopener noreferrer\">National Center for Biotechnology Information – Impacto económico de lesiones ocupacionales</a></li>\n<li><a href=\"https://www.ilo.org/global/publications/books/WCMS_740425/lang--es/index.htm\" target=\"_blank\" rel=\"noopener noreferrer\">ILO – Guía de buenas prácticas en SST</a></li>\n<li><a href=\"https://www.unece.org/cefact/standards/occupationalhealth.html\" target=\"_blank\" rel=\"noopener noreferrer\">UNECE – Normas de salud y seguridad ocupacional</a></li>\n<li><a href=\"https://www.minsal.cl/sites/default/files/2019-04/Guia_SST.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Ministerio de Salud de Chile – Guía de SST</a></li>\n</ul>\n                </div></main></body></html>","Sesion_Chat_1785267236333.html":"\n            <!DOCTYPE html>\n            <html lang=\"es\">\n            <head>\n                <meta charset=\"UTF-8\">\n                <title>Sesión de Chat</title>\n                <style>\n                    body { font-family: sans-serif; line-height: 1.6; padding: 20px; color: #333; }\n                    .user-message { background-color: #007bff; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; margin-left: auto; text-align: right; }\n                    .bot-message { background-color: #e9ecef; color: #343a40; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; }\n                    .system-message { text-align: center; color: #666; font-style: italic; margin-bottom: 10px; }\n                    pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }\n                    code { background: #eee; padding: 2px 4px; border-radius: 3px; }\n                    .bot-message code { background: #d0d0d0; }\n                </style>\n            </head>\n            <body>\n                <h2>Sesión de Chat con Documentos</h2>\n                <p>Archivos cargados: Art 2.pdf, Art 2.pdf</p>\n                <hr>\n                <div class=\"chat-container\">\n                    <div class=\"system-message\">Por favor, carga al menos un PDF para comenzar.</div><div class=\"system-message\">Cargando Art 2.pdf...</div><div class=\"system-message\">\"Art 2.pdf\" está listo.</div><div class=\"system-message\">Cargando Art 2.pdf...</div><div class=\"system-message\">\"Art 2.pdf\" está listo.</div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Compara los documentos en términos de objetivos, enfoque metodológico y conclusiones principales. Resume en formato claro.</div>\n                    <img src=\"blob:https://proyectodescartes.org/08e7716a-8727-48dd-ae7f-5e61daec303d\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/09430741-8121-495e-a547-404bfb16a467\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Basándome en los documentos proporcionados, aquí tienes una comparación de sus objetivos, enfoques metodológicos y conclusiones principales:</p>\n<p><strong>Documento 1: \"Asturias y Colombia\" (Artículo de Investigación)</strong></p>\n<ul>\n<li><p><strong>Objetivos:</strong></p>\n<ul>\n<li>Realizar una descripción narrativa de la evolución histórica normativa en Seguridad y Salud en el Trabajo (SST) en Colombia.</li>\n<li>Enfocarse en la Prevención de Riesgos Laborales (PRL) dentro de esta evolución.</li>\n<li>Distinguir y reconocer los avances en la prevención de riesgos laborales, el cuidado y el bienestar físico y mental de los trabajadores.</li>\n</ul>\n</li>\n<li><p><strong>Enfoque Metodológico:</strong></p>\n<ul>\n<li>Se realizó una investigación documental utilizando fuentes científicas, repositorios normativos y actualizaciones de organismos legales colombianos.</li>\n<li>Se empleó análisis de contenido para interpretar los instrumentos normativos implementados.</li>\n<li>Se construyó una matriz legal con codificación cualitativa, organizando las regulaciones cronológicamente.</li>\n<li>Se realizó un análisis diacrónico contextualizando las normativas con el entorno sociopolítico.</li>\n<li>Se consultaron 280 legislaciones colombianas desde el origen de la normativa SST hasta 2024.</li>\n</ul>\n</li>\n<li><p><strong>Conclusiones Principales:</strong></p>\n<ul>\n<li>La evolución de las normativas en SST en Colombia refleja un crecimiento continuo en la conciencia sobre la protección de los trabajadores.</li>\n<li>Se evidencia un progreso sostenido en las normativas de SST, demostrando una mayor conciencia sobre la protección integral de los trabajadores.</li>\n<li>La evolución normativa en SST en Colombia muestra un compromiso creciente con la seguridad laboral, avanzando hacia condiciones más saludables y seguras.</li>\n<li>A pesar de los avances, el país aún enfrenta desafíos significativos en la implementación efectiva de medidas y en la sensibilización de todos los actores involucrados.</li>\n</ul>\n</li>\n</ul>\n<p><strong>Documento 2: \"Asturias y Colombia\" (Fragmento adicional con información similar)</strong></p>\n<p>Este documento parece ser una repetición o una sección adicional del primer documento, presentando la misma información en cuanto a objetivos, metodología y conclusiones. Los puntos clave son idénticos a los del primer documento, reforzando las conclusiones sobre la evolución positiva pero continua de la normativa de SST en Colombia, el enfoque en la prevención y el bienestar, y la metodología de análisis documental y de contenido.</p>\n<p><strong>Resumen Comparativo en Formato Claro:</strong></p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Característica</th>\n<th align=\"left\">Documento 1: \"Asturias y Colombia\"</th>\n</tr>\n</thead>\n<tbody><tr>\n<td align=\"left\"><strong>Objetivos Principales</strong></td>\n<td align=\"left\">Describir narrativamente la evolución histórica de la normativa en SST en Colombia, enfocándose en la prevención de riesgos laborales y el bienestar del trabajador. Identificar avances y reconocer la protección integral.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Enfoque Metodológico</strong></td>\n<td align=\"left\">Investigación documental, análisis de contenido, construcción de matriz legal cronológica, análisis diacrónico contextualizado. Revisión de 280 legislaciones colombianas.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Conclusiones Clave</strong></td>\n<td align=\"left\">La normativa de SST en Colombia ha evolucionado positivamente, evidenciando una creciente conciencia y compromiso con la protección del trabajador. Existe un progreso sostenido hacia condiciones laborales más seguras y saludables. Persisten desafíos en la implementación y sensibilización.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Cobertura Temporal</strong></td>\n<td align=\"left\">Desde la época colonial hasta el siglo XXI, con un enfoque particular en el periodo de 1914 a 2024.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Énfasis Principal</strong></td>\n<td align=\"left\">Evolución histórica, marco normativo, prevención de riesgos, salud ocupacional, seguridad laboral, bienestar del trabajador en Colombia.</td>\n</tr>\n<tr>\n<td align=\"left\"><strong>Estructura</strong></td>\n<td align=\"left\">Introducción, Metodología, Resultados (con tabla de síntesis normativa), Discusión, Conclusiones, Referencias.</td>\n</tr>\n</tbody></table>\n<p>Ambos documentos, al ser esencialmente el mismo artículo, comparten los mismos objetivos, metodología y conclusiones, proporcionando una visión detallada de cómo la legislación sobre seguridad y salud en el trabajo ha progresado en Colombia a lo largo del tiempo, destacando los hitos normativos y el creciente compromiso con la protección de los trabajadores.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Integra los hallazgos de los documentos en una síntesis coherente que explique el tema de forma unificada.</div>\n                    <img src=\"blob:https://proyectodescartes.org/08e7716a-8727-48dd-ae7f-5e61daec303d\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/09430741-8121-495e-a547-404bfb16a467\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Este documento presenta una narrativa descriptiva de la evolución histórica de la normativa en Seguridad y Salud en el Trabajo (SST) en Colombia. La investigación se enfoca en la Prevención de Riesgos Laborales (PRL) y se basa en una metodología de investigación documental y análisis de contenido de fuentes científicas, repositorios normativos y actualizaciones de organismos legales colombianos.</p>\n<p>Los resultados del análisis evidencian un progreso sostenido en las normativas de SST en Colombia, lo que refleja una creciente conciencia sobre la protección integral de los trabajadores. Las conclusiones indican que esta evolución normativa demuestra un compromiso creciente con la seguridad laboral, avanzando hacia condiciones de trabajo más saludables y seguras.</p>\n<p>El documento detalla hitos legislativos clave desde los inicios de la regulación en Colombia, incluyendo la Ley 15 de 1915 (Ley Uribe), la creación del Ministerio de la Protección Social, la fundación del Instituto Colombiano de Seguro Social (ICSS) con la Ley 90 de 1946, y el Código Sustantivo del Trabajo (Decreto Ley 2663 de 1950). Se resalta la influencia de los modelos económicos, la globalización y los acuerdos internacionales en la década de 1980 y 1990, así como la consolidación del Sistema General de Riesgos Profesionales en 1994.</p>\n<p>En el siglo XXI, se observa una transición hacia un enfoque preventivo, con la implementación del Sistema de Gestión de la Seguridad y Salud en el Trabajo (SG-SST) y normativas como la Resolución 0312 de 2019. La pandemia de COVID-19 impulsó reformas adicionales, como la Resolución 223 de 2021, enfocada en la prevención de enfermedades infecciosas, y la Resolución 3077 de 2022, que promueve una cultura de autocuidado.</p>\n<p>En resumen, la evolución normativa en Colombia ha pasado de un estado de desconocimiento a un sistema robusto e integral, con un esfuerzo interinstitucional para mejorar las condiciones laborales y proteger la salud de los trabajadores. A pesar de los avances, persisten desafíos en la implementación efectiva de las medidas y en la sensibilización de todos los actores involucrados.</p>\n</div>\n                        <div style=\"margin-top:10px; font-size:0.8em; color:var(--secondary-color); font-style:italic;\">\n                            Modelo: gemini-search\n                        </div>\n                    </div>\n                </div>\n            </div><div class=\"user-message\">\n                <div class=\"message user-message\">\n                    <div class=\"message-bubble user-bubble\">Evalúa cuál documento presenta argumentos más sólidos y por qué. Considera evidencia, coherencia y rigor.</div>\n                    <img src=\"blob:https://proyectodescartes.org/08e7716a-8727-48dd-ae7f-5e61daec303d\" class=\"avatar-img\" alt=\"User Avatar\" data-avatar-type=\"user\">\n                </div>\n            </div><div class=\"bot-message\">\n                <div class=\"message\">\n                    <img src=\"blob:https://proyectodescartes.org/09430741-8121-495e-a547-404bfb16a467\" class=\"avatar-img\" alt=\"Bot Avatar\" data-avatar-type=\"bot\">\n                    <div class=\"message-bubble bot-bubble\">\n                        <strong>Chatbot:</strong> \n                        <div style=\"margin-top:5px;\"><p>Ambos documentos, \"Asturias y Colombia\", presentan una visión detallada sobre la evolución histórica de la normativa en Seguridad y Salud en el Trabajo (SST) en Colombia. Sin embargo, el documento que parece presentar argumentos más sólidos, basándose en la evidencia, coherencia y rigor, es el artículo de investigación titulado \"Descripción Narrativa de la Evolución Histórica Normativa en Seguridad y Salud en el Trabajo en Colombia\", también asociado con \"Asturias y Colombia\".</p>\n<p>Aquí se detallan las razones:</p>\n<ul>\n<li><p><strong>Metodología Clara y Rigurosa:</strong> El artículo de investigación describe explícitamente la metodología utilizada: análisis de contenido, investigación documental, consulta de fuentes primarias y secundarias, y construcción de una matriz legal. Se menciona el análisis de 280 legislaciones colombianas desde su origen hasta 2024. Esta transparencia metodológica otorga credibilidad y permite evaluar el rigor del estudio.</p>\n</li>\n<li><p><strong>Estructura y Evidencia Detallada:</strong> El artículo presenta una estructura organizada con secciones de Introducción, Metodología, Resultados, Discusión y Conclusiones. Los \"Resultados\" incluyen una tabla (Tabla 1) que sintetiza normativas clave de SST en Colombia, mencionando el documento, año y alcance de cada una (e.g., Ley 57 de 1915, Decreto 1295 de 1994, ISO 45001 de 2018). La \"Discusión\" analiza cronológicamente la evolución de estas normativas, vinculándolas con contextos socioeconómicos y marcando hitos legislativos importantes.</p>\n</li>\n<li><p><strong>Coherencia y Profundidad:</strong> El artículo desarrolla una narrativa coherente que rastrea la evolución de la SST desde sus inicios hasta la actualidad, destacando factores como la globalización, la intervención de organismos internacionales (OIT) y eventos como la pandemia de COVID-19. La discusión finaliza con conclusiones que resumen los hallazgos y las áreas de mejora, demostrando un análisis profundo del tema.</p>\n</li>\n<li><p><strong>Enfoque Académico y Referencias:</strong> Al ser un \"Artículo de Investigación\", se espera un nivel de rigor académico mayor. Incluye referencias bibliográficas detalladas al final, lo que permite verificar las fuentes y demuestra la base teórica y empírica del trabajo.</p>\n</li>\n</ul>\n<p>Por otra parte, el segundo documento, también titulado \"Asturias y Colombia\", parece ser un resumen o una versión preliminar del artículo de investigación. Si bien menciona aspectos similares y comparte la autoría, carece de la profundidad metodológica, la estructura detallada de resultados y la tabla de normativas que caracterizan al artículo de investigación. Su contenido es más introductorio y de resumen general.</p>\n<p>En resumen, el \"Artículo de Investigación: Descripción Narrativa de la Evolución Histórica Normativa en Seguridad y Salud en el Trabajo en Colombia\" presenta argumentos m
